    <script>

        const EXPECTED_ORIGIN = location.origin; // adjust if truly cross-origin
        const SCORM_QUEUE_KEY = "scorm_send_queue_v1";
        const SCORM_LATEST_KEY = "scorm_latest_payload_v1";
        const PAGE_SCORM_ATTEMPT_ID = "scorm_attempt_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        // Function to mark the SCORM module as completed
        function markAsCompleted() {
            let confirmation = confirm("Is the course completed?\n हे मोड्यूल कंप्लिट केले आहे का?\n क्या आपने ये कोर्स पूरा किया है?");
            if (confirmation) {
                window.location.href = '/lmshomepage.html'; // Navigate back to the index page if confirmed
            }
        }
        async function urlExists(url) {
            try {
                const res = await fetch(url, { method: "HEAD" });
                return res.ok;
            } catch (e) {
                console.warn("HEAD check failed for", url, e);
                return false;
            }
        }

        // Function to load SCORM content based on selected package
        async function loadScormContent() {
            const courseID = getCourseIDFromURL();
            const urlParams = new URLSearchParams(window.location.search);
            const scormParam = urlParams.get('scorm'); // e.g. "Scorm_123" or "uploads/Scorm_123"

            if (!scormParam) {
                alert('No SCORM package selected.');
                return;
            }

            // Normalize to folder name (last segment) – works for "Scorm_1" or "uploads/Scorm_1"
            const parts = scormParam.split(/[\\/]/);
            const folderName = parts[parts.length - 1];

            const iframe = document.getElementById('scormFrame');

            // Multilingual variants carry their full language-folder path.
            // Try that exact folder first for both SCORM and Excel quizzes.
            const directBase = '/' + scormParam.replace(/^\/+/, '').replace(/\\/g, '/');
            const directIndexUrl = `${directBase}/index_lms.html`;
            const directStoryUrl = `${directBase}/story.html`;
            const directQuizUrl = `${directBase}/${courseID}_quiz.html`;

            // Priority 1: index_lms.html
            const indexLmsUrl = `/scorm/${folderName}/index_lms.html`;
            // Priority 2: story.html
            const storyUrl = `/scorm/${folderName}/story.html`;
            
            // Priority 3: fallback quiz html
            const quizUrl = `uploads/Training Assessment/Posttest assessment/${courseID}_course/${courseID}_quiz.html`;

            try {
                if (await urlExists(directIndexUrl)) {
                    iframe.src = directIndexUrl;
                } else if (await urlExists(directStoryUrl)) {
                    iframe.src = directStoryUrl;
                } else if (await urlExists(directQuizUrl)) {
                    iframe.src = directQuizUrl;
                } else if (await urlExists(indexLmsUrl)) {
                    iframe.src = indexLmsUrl;
                } else if (await urlExists(storyUrl)) {
                    iframe.src = storyUrl;
                } else {
                    // Last fallback – your Excel-based quiz
                    iframe.src = quizUrl;
                }
            } catch (e) {
                console.error("Error while selecting SCORM launch file, falling back to quiz:", e);
                iframe.src = quizUrl;
            }
        }


        function loadQueue() {
            try { return JSON.parse(localStorage.getItem(SCORM_QUEUE_KEY) || "[]"); }
            catch { return []; }
        }
        function saveQueue(q) {
            localStorage.setItem(SCORM_QUEUE_KEY, JSON.stringify(q));
        }
        function saveLatest(payload) {
            localStorage.setItem(SCORM_LATEST_KEY, JSON.stringify(payload));
        }
        function getCourseID() {
            const p = new URLSearchParams(location.search);
            return p.get("courseID") || "";
        }
        function getCourseName() {
            const p = new URLSearchParams(location.search);
            return p.get("courseName") || "";
        }

        // Normalize/validate incoming data; do not drop zeros
        function norm(data) {
            const toStr = v => (v === undefined || v === null) ? "" : String(v);
            return {
                posttestScore: toStr(data.posttestScore),
                duration: toStr(data.duration),
                Status: toStr(data.Status),
                Score: toStr(data.Score),
                // add context here
                courseID: getCourseID(),
                courseName: getCourseName(),
                attemptId: PAGE_SCORM_ATTEMPT_ID,
                reason: toStr(data.reason),
                ts: data.ts || Date.now()
            };
        }

        /** ---------- Queue + Retry Sender ---------- **/
        async function sendPacket(pkt) {
            const urlParams = new URLSearchParams(location.search);
            const isRefreshal = urlParams.get('refreshal') === 'true';
            const refreshalCourseID = isRefreshal ? getCourseID() : null; // Use RF_XXX for refreshal

            if (isRefreshal) {
                // For refreshal: Call refreshal-specific endpoint
                const r2 = await fetch("/updateRefreshalTrainingData", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        posttestScore: pkt.posttestScore,
                        Score: pkt.Score,
                        Status: pkt.Status,
                        duration: pkt.duration,
                        refreshalCourseID: refreshalCourseID
                    })
                });
                if (r2.status === 410 || r2.status === 404) {
                    console.warn("Dropping SCORM packet because refreshal record is missing", refreshalCourseID);
                    return; // drop packet
                }
                if (!r2.ok) throw new Error("updateRefreshalTrainingData failed: " + r2.status);
            } else {
                // Original: For regular courses
                const r2 = await fetch("/updateUserSCORMDataInCourseTable", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        posttestScore: pkt.posttestScore,
                        Status: pkt.Status,
                        Score: pkt.Score,
                        duration: pkt.duration,
                        courseID: pkt.courseID,
                        attemptId: pkt.attemptId,
                        reason: pkt.reason,
                        source: urlParams.get('source') === 'refresher' ? 'refresher' : undefined
                    })
                });
                if (r2.status === 410 || r2.status === 404) {
                    console.warn("Dropping SCORM packet because course table is missing", pkt.courseID);
                    return; // drop packet
                }
                if (!r2.ok) throw new Error("updateUserSCORMDataInCourseTable failed: " + r2.status);
            }
        }

        // Exponential backoff worker
        let sending = false;
        async function flushQueue() {
            if (sending) return;
            sending = true;
            try {
                let q = loadQueue();
                let delay = 800; // start small
                while (q.length) {
                    const pkt = q[0];
                    try {
                        await sendPacket(pkt);
                        q.shift();
                        saveQueue(q);
                        delay = 800; // reset after success
                        console.log("SCORM packet flushed:", pkt);
                    } catch (err) {
                        console.warn("SCORM send failed, will retry:", err.message);
                        await new Promise(r => setTimeout(r, delay));
                        delay = Math.min(delay * 2, 15000);
                    }
                }
            } finally {
                sending = false;
            }
        }

        // Flush on page load and on unload visibility changes
        window.addEventListener("load", flushQueue);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") flushQueue();
        });
        window.addEventListener("beforeunload", () => { flushQueue(); });

        /** ---------- Single message listener ---------- **/
        window.addEventListener("message", function (event) {
            // If same-origin embed, enforce origin match
            if (EXPECTED_ORIGIN !== "*" && event.origin !== EXPECTED_ORIGIN) {
                return; // ignore unexpected origins
            }
            const data = event.data || {};
            if (data.type !== "SCORM_DATA") return; // ignore other chatter

            const pkt = norm(data);
            // show on page (optional)
            document.getElementById("posttestScore").textContent = "Posttest: " + pkt.posttestScore;
            document.getElementById("Status").textContent = "Status: " + pkt.Status;
            document.getElementById("Score").textContent = "Score: " + pkt.Score;
            document.getElementById("duration").textContent = "Duration: " + pkt.duration;

            // persist latest & enqueue
            saveLatest(pkt);
            const q = loadQueue();
            // de-dup by timestamp (basic idempotency)
            if (!q.some(x => x.ts === pkt.ts)) {
                q.push(pkt);
                saveQueue(q);
            }
            flushQueue();
        }, false);

        // Function to extract courseID from URL parameters
        function getCourseIDFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('courseID');
            /*const urlParams = new URLSearchParams(window.location.search);
