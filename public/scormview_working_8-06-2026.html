    <script>

        const EXPECTED_ORIGIN = location.origin; // adjust if truly cross-origin
        const SCORM_QUEUE_KEY = "scorm_send_queue_v1";
        const SCORM_LATEST_KEY = "scorm_latest_payload_v1";
        // Function to mark the SCORM module as completed
        function markAsCompleted() {
            let confirmation = confirm("Is the course completed?\n हे मोड्यूल कंप्लिट केले आहे का?\n क्या आपने ये कोर्स पूरा किया है?");
            if (confirmation) {
                window.location.href = '/lmshomepage.html'; // Navigate back to the index page if confirmed
            }
        }

        // Function to load SCORM content based on selected package
        function loadScormContent() {

            // Retrieve courseID from URL parameters
            const courseID = getCourseIDFromURL();

            const selectedCourse = JSON.parse(localStorage.getItem('selectedCourse'));
            const urlParams = new URLSearchParams(window.location.search);
            const selectedScorm = urlParams.get('scorm');

            if (selectedScorm) {
                // Strip leading 'uploads/' or 'uploads\' prefix if present, and normalize backslashes
                const folderName = selectedScorm.replace(/^uploads[\\/]/i, '').replace(/\\/g, '/');
                const primaryScormUrl = `/scorm/${folderName}/story.html`;
                //const fallbackScormUrl = `/scorm/${folderName}/${courseID}_quiz.html`;
                const fallbackScormUrl = `/uploads/Training Assessment/Posttest assessment/${courseID}_course/${courseID}_quiz.html`

                // Try to load the primary URL
                fetch(primaryScormUrl, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            scormFrame.src = primaryScormUrl;
                        } else {
                            // If the primary URL does not exist, load the fallback URL
                            scormFrame.src = fallbackScormUrl;
                        }
                    })
                    .catch(() => {
                        // On network or other errors, try the fallback URL
                        scormFrame.src = fallbackScormUrl;
                    });
            }

            // if (selectedScorm) {
            //     const scormUrl = `/scorm/${selectedScorm}/story.html`;
            //     document.getElementById('scormFrame').src = scormUrl;
            // }
            // else if (selectedScorm) {
            //     const scormUrl = `/scorm/${selectedScorm}/${courseID}_quiz.html`;
            // }
            // else {
            //     alert('No SCORM package selected.');
            // }
        }


        function loadQueue() {
            try { return JSON.parse(localStorage.getItem(SCORM_QUEUE_KEY) || "[]"); }
            catch { return []; }
        }
        function saveQueue(q) {
            localStorage.setItem(SCORM_QUEUE_KEY, JSON.stringify(q));
        }
        function saveLatest(payload) {
            localStorage.setItem(SCORM_LATEST_KEY, JSON.stringify(payload));
        }
        function getCourseID() {
            const p = new URLSearchParams(location.search);
            return p.get("courseID") || "";
        }
        function getCourseName() {
            const p = new URLSearchParams(location.search);
            return p.get("courseName") || "";
        }

        // Normalize/validate incoming data; do not drop zeros
        function norm(data) {
            const toStr = v => (v === undefined || v === null) ? "" : String(v);
            return {
                posttestScore: toStr(data.posttestScore),
                duration: toStr(data.duration),
                Status: toStr(data.Status),
                Score: toStr(data.Score),
                // add context here
                courseID: getCourseID(),
                courseName: getCourseName(),
                ts: data.ts || Date.now()
            };
        }

        /** ---------- Queue + Retry Sender ---------- **/
        async function sendPacket(pkt) {
            // 1) Update users table
            const r1 = await fetch("/updateUserSCORMData", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    posttestScore: pkt.posttestScore,
                    courseID: pkt.courseID,
                    courseName: pkt.courseName
                })
            });
            if (!r1.ok) throw new Error("updateUserSCORMData failed: " + r1.status);

            // 2) Update course_${courseID} row
            const r2 = await fetch("/updateUserSCORMDataInCourseTable", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    posttestScore: pkt.posttestScore,
                    Status: pkt.Status,
                    Score: pkt.Score,
                    duration: pkt.duration,
                    courseID: pkt.courseID
                })
            });
            if (!r2.ok) throw new Error("updateUserSCORMDataInCourseTable failed: " + r2.status);
        }

        // Exponential backoff worker
        let sending = false;
        async function flushQueue() {
            if (sending) return;
            sending = true;
            try {
                let q = loadQueue();
                let delay = 800; // start small
                while (q.length) {
                    const pkt = q[0];
                    try {
                        await sendPacket(pkt);
                        q.shift();
                        saveQueue(q);
                        delay = 800; // reset after success
                        console.log("SCORM packet flushed:", pkt);
                    } catch (err) {
                        console.warn("SCORM send failed, will retry:", err.message);
                        await new Promise(r => setTimeout(r, delay));
                        delay = Math.min(delay * 2, 15000);
                    }
                }
            } finally {
                sending = false;
            }
        }

        // Flush on page load and on unload visibility changes
        window.addEventListener("load", flushQueue);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") flushQueue();
        });
        window.addEventListener("beforeunload", () => { flushQueue(); });

        /** ---------- Single message listener ---------- **/
        window.addEventListener("message", function (event) {
            // If same-origin embed, enforce origin match
            if (EXPECTED_ORIGIN !== "*" && event.origin !== EXPECTED_ORIGIN) {
                return; // ignore unexpected origins
            }
            const data = event.data || {};
            if (data.type !== "SCORM_DATA") return; // ignore other chatter

            const pkt = norm(data);
            // show on page (optional)
            document.getElementById("posttestScore").textContent = "Posttest: " + pkt.posttestScore;
            document.getElementById("Status").textContent = "Status: " + pkt.Status;
            document.getElementById("Score").textContent = "Score: " + pkt.Score;
            document.getElementById("duration").textContent = "Duration: " + pkt.duration;

            // persist latest & enqueue
            saveLatest(pkt);
            const q = loadQueue();
            // de-dup by timestamp (basic idempotency)
            if (!q.some(x => x.ts === pkt.ts)) {
                q.push(pkt);
                saveQueue(q);
            }
            flushQueue();
        }, false);

        // Function to extract courseID from URL parameters
        function getCourseIDFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('courseID');
            /*const urlParams = new URLSearchParams(window.location.search);
            const courseID = urlParams.get('courseID');
            const courseName = urlParams.get('courseName');
            return { courseID, courseName };*/
        }
        function getCourseInfoFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('courseName');
        }

        // Call the function to update the navbar when the page loads
        //window.onload = updateNavbarWithCourseID;
        // Call the function to update the navbar and load SCORM content when the page loads
        window.onload = function () {

            //updateNavbarWithCourseID();

                .then(console.log('selectedCourse.courseID from scormview:', selectedCourse.courseID))
                .catch(error => console.error('Error updating attempt:', error));
        };
