        function loadScormContent() {

        // Call the function to load SCORM content when the page loads
        //window.onload = loadScormContent;

        // Function to send SCORM variables to the server
        function sendSCORMDataToServer(data) {
            fetch('/updateUserSCORMData', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to update user SCORM data');
                    }
                    console.log('User SCORM data updated successfully');
                })
                .catch(error => console.error('Error:', error));
        }
        // Function to handle SCORM data received from the SCORM package
        window.addEventListener("message", function (event) {
            if (event.data && /*event.data.uName && event.data.duration && event.data.date && event.data.time && event.data.Status &&*/ event.data.pretestScore && event.data.posttestScore) {
                // Extract the relevant SCORM variables
                const { uniqueID, pretestScore, posttestScore } = event.data;

                // Retrieve courseID from URL parameters
                const courseID = getCourseIDFromURL();
                if (courseID) {
                    console.log("Course ID: " + courseID);
                }
                else {
                    console.log("Course ID not found.");
                }
                const courseName = getCourseInfoFromURL();
                if (courseName) {
                    console.log("Course Name: " + courseName);
                }
                else {
                    console.log("Course Name not found.");
                }


                // Send the SCORM data to the server
                sendSCORMDataToServer({ uniqueID, pretestScore, posttestScore, courseID, courseName });
            }
        }, false);

        // Function to extract courseID from URL parameters
        function getCourseIDFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('courseID');
            /*const urlParams = new URLSearchParams(window.location.search);
            const courseID = urlParams.get('courseID');
            const courseName = urlParams.get('courseName');
            return { courseID, courseName };*/
        }
        function getCourseInfoFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('courseName');
        }

        function updateNavbarWithCourseID() {

            const courseID = getCourseIDFromURL();

        // Call the function to update the navbar and load SCORM content when the page loads
        window.onload = function () {
            getCourseIDFromURL();
            getCourseInfoFromURL();
            loadScormContent();
            //updateNavbarWithCourseID();
            const selectedCourse = JSON.parse(localStorage.getItem('selectedCourse'));
            if (selectedCourse){
                const courseID = selectedCourse.courseID;
            }
            // Fetch and update the attempt count
            fetch(`/updateAttempt?courseID=${selectedCourse.courseID}`)
                .then(response => response.json())
                .then(data => console.log('Attempt updated:', data))
                .then(console.log('selectedCourse.courseID from scormview:', selectedCourse.courseID))
                .catch(error => console.error('Error updating attempt:', error));
        };
