        function findCourseInfoForUser(user, courseNamesData) {
            // Iterate over courseNamesData to find the correct course information for the user
            for (let i = 0; i < courseNamesData.length; i++) {
                const course = courseNamesData[i];
                // Check if the courseID matches the one in the user data
                if (course.courseID === user.courseID) {
                    return {
                        courseID: course.courseID,
                        courseName: course.courseName
                    };
                }
            }
            // Return a default value if no match is found
            return {
                courseID: '',
                courseName: ''
            };
        }

        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('gradesTable');
            const tr = table.getElementsByTagName('tr');
            const column = document.getElementById('searchColumn').value; // Get the value from the searchColumn input

            // Loop through all table rows, and hide those who don't match the search query
            for (let i = 0; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td')[column]; // Use the column index provided by the searchColumn input
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }


        // Function to download data in .xlsx format
        function downloadData() {
            const gradesTable = document.getElementById('gradesTable');
            const tableData = [];

            // Loop through table rows and cells to get data
            for (let i = 0; i < gradesTable.rows.length; i++) {
                const rowData = [];
                const row = gradesTable.rows[i];
                for (let j = 0; j < row.cells.length; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                tableData.push(rowData);
            }

            // Convert data to CSV format
            const csvContent = tableData.map(row => row.join(',')).join('\n');

            // Create a Blob object containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);

            // Set the filename for the download
            link.download = 'grades_data.csv';

            // Trigger the download
            link.click();
        }
        // Add event listener to the download button
        document.getElementById('downloadButton').addEventListener('click', downloadData);

        // Function to enable editing for the entire table
        function enableEdit() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            cells.forEach(cell => {
                // Get the index of the cell's column
                const columnIndex = cell.cellIndex;
                // Exclude certain columns from being editable
                if (!['id', 'name', 'uName', 'employeeID'].includes(cell.dataset.column)) {
                    cell.contentEditable = true;
                    // Add event listener for Tab key press
                    cell.addEventListener('keydown', function (event) {
                        if (event.key === 'Tab') {
                            // Prevent default Tab behavior
                            event.preventDefault();
                            // Find the next editable cell
                            let nextCell = cell.nextElementSibling;
                            while (nextCell) {
                                if (!['id', 'name', 'uName', 'employeeID'].includes(nextCell.dataset.column)) {
                                    // Focus on the next editable cell
                                    nextCell.focus();
                                    break;
                                }
                                nextCell = nextCell.nextElementSibling;
                            }
                        }
                    });
                }
            });
            // Show the save button
            document.getElementById('saveButton').style.display = 'inline-block';
            //checkb = false;
        }

        // Function to save changes
        function saveChanges() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            const updatedData = [];

            //Skip the first three columns (Sr No, Name, Username)
            //Iterate through cells to collect updated data
            cells.forEach((cell, user) => {
                // Skip the first three columns (Sr No, Name, Username)
                if (cell.cellIndex > 0 && !['id', 'name', 'uName', 'employeeID'].includes(cell.dataset.column)) {
                    console.log('Cell Data:', cell.dataset);
                    // Get the new value after editing
                    const newValue = cell.textContent.trim();
                    const columnName = cell.dataset.column;
                    if (newValue !== '') { // Check if newValue is not empty
                        updatedData.push({
                            employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                            columnName: columnName,
                            newValue: newValue,
                            courseID: cell.dataset.courseID,
                            courseName: cell.dataset.courseName
                        });
                    }
                    else { // If cell value is cleared, clear the corresponding uCourseX value
                        if (columnName.endsWith('Pretest') || columnName.endsWith('Posttest')) {
                            const courseNumber = columnName.match(/\d+/)[0];
                            const uCourseCell = cell.parentElement.querySelector(`[data-column="uCourse${courseNumber}"]`);
                            const courseXPretestCell = cell.parentElement.querySelector(`[data-column="course${courseNumber}Pretest"]`);
                            const courseXPosttestCell = cell.parentElement.querySelector(`[data-column="course${courseNumber}Posttest"]`);

                            // Check if both courseXPretest and courseXPosttest are cleared or one is cleared while the other is null
                            if ((newValue === '' && courseXPosttestCell.textContent === '') ||
                                (newValue === '' && courseXPosttestCell.textContent === 'null') ||
                                (courseXPretestCell.textContent === '' && newValue === '') ||
                                (courseXPretestCell.textContent === 'null' && newValue === '')) {
                                uCourseCell.textContent = ''; // Clear the uCourseX cell
                                updatedData.push({
                                    employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                                    columnName: `uCourse${courseNumber}`,
                                    newValue: null, // Clear the corresponding uCourseX value
                                    courseID: cell.dataset.courseID,
                                    courseName: null
                                });
                            }

                            // Also clear the courseXPretest or courseXPosttest cell
                            if (newValue !== null) {
                                updatedData.push({
                                    employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                                    columnName: columnName,
                                    newValue: null, // Set the courseXPretest or courseXPosttest value to null
                                    courseID: cell.dataset.courseID,
                                    courseName: null // Set courseName to null
                                });
                            }
                        }
                    }

                }
            });
            console.log('Updated data:', updatedData);
            // Check if there are any changes to save
            if (updatedData.length === 0) {
                console.log('No changes to save.');
                return;
            }

            // Autofill uCourseX cells based on course Pretest and Posttest values
            //autofillUCourseCells(updatedData);

            // Show confirmation alert before saving
            const confirmSave = confirm("Are you sure you want to save the changes?");
            if (!confirmSave) {
                location.reload();
                return; // Do not proceed with saving if user clicks "Cancel"
            }
            else {
                // Send updated data to the server
                updatedData.forEach(data => {
                    console.log('Calling updateDatabase with:', data.employeeID, data.columnName, data.newValue, data.courseName);
                    updateDatabase(data.employeeID, data.columnName, data.newValue, data.courseName);
                });

                // Send updated data to the server
                fetch('/saveChanges', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ updatedData: updatedData })
                })
                    .then(response => {
                        if (response.ok) {
                            console.log('Changes saved successfully');
                            // Update uCourseX cells based on course Pretest and Posttest values after saving changes
                            updatedData.forEach(entry => {
                                const columnName = entry.columnName;
                                const newValue = entry.newValue;
                                const courseName = entry.courseName;

                                // Check if the column corresponds to a course Pretest or Posttest
                                if (columnName && columnName.startsWith('course') && (columnName.endsWith('Pretest') || columnName.endsWith('Posttest'))) {
                                    const courseNumber = columnName.match(/\d+/)[0]; // Extract the course number from the column name (e.g., 'course1')

                                    // Get the corresponding uCourseX cell
                                    const uCourseCell = document.querySelector(`[data-column="uCourse${courseNumber}"]`);

                                    // If the entered value is not empty, undefined, or null, fill the corresponding uCourseX cell with the courseName
                                    if (newValue && newValue.trim() !== '' && newValue.trim() !== undefined && newValue.trim() !== null) {
                                        uCourseCell.textContent = courseName; // Fill the uCourseX cell with the courseName
                                    } else {
                                        uCourseCell.textContent = ''; // Clear the uCourseX cell if the entered value is empty, undefined, or null
                                    }
                                }
                            });
                            location.reload();
                        } else {
                            throw new Error('Failed to save changes');
                        }
                    })
                    .catch(error => {
                        console.error('Error saving changes:', error);
                    });
                document.getElementById('saveButton').style.display = 'none';
            }

        }



        // Function to update the database with edited data
        function updateDatabase(updatedData) {
            // Send the updatedData to the server using AJAX or fetch
            fetch('/saveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ updatedData: updatedData })
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Error saving changes:', error);
                });
        }
