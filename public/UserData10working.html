        function displayUserData(userData) {
            const userDetailsDiv = document.getElementById('userDetails');

            const user = Array.isArray(userData) ? userData[0] : userData;

            if (user && user.uniqueID) {
                const userHtml = `
            <p>Name: ${user.name}</p>
            <p>Email ID: ${user.emailID}</p>
            <p>Employee ID: ${user.employeeID}</p>
            <p>Username: ${user.uName}</p>
            <p>Password: ${user.uPass}</p>
            <p>Mobile No: ${user.mobileNo}</p>
            <p>Date of Birth: ${user.dateOfBirth}</p>
            <p>Address: ${user.address}</p>
            <p>Date of Joining: ${user.dateOfJoining}</p>
            <p>Department: ${user.department}</p>
            <p>Role: ${user.uRole}</p>
            <p>Registration Date: ${user.currentDate}</p>
            <img src="/photos/${user.photo}" alt="User Photo" width="200" height="200">
        `;
                userDetailsDiv.innerHTML = userHtml;
            } else {
                userDetailsDiv.innerHTML = '<p>User data not found</p>';
            }
        }
