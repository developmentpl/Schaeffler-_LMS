    function displayGrades(grades) {
            const gradesTable = document.getElementById('gradesTable');
            const tbody = gradesTable.getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            const attemptedGrades = Array.isArray(grades) ? grades : [];

            // Group course rows level-wise (Level 1, Level 2, Level 3, Level 4).
            // Any course whose level doesn't match one of these known buckets
            // still shows up under "Other" so nothing silently disappears.
            const levelOrder = ['Level 1', 'Level 2', 'Level 3', 'Level 4'];
            const groups = {};
            attemptedGrades.forEach(grade => {
                const key = levelOrder.includes(grade.courseLevel) ? grade.courseLevel : 'Other';
                if (!groups[key]) groups[key] = [];
                groups[key].push(grade);
            });

            let srNo = 0;
            const scoredValues = [];
            let passCount = 0;
            let attemptedCount = 0;
            let incompleteCount = 0;

            [...levelOrder, 'Other'].forEach(levelKey => {
                const levelGrades = groups[levelKey];
                if (!levelGrades || !levelGrades.length) return;

                const headerRow = `<tr class="level-header-row"><td colspan="3">${levelKey}</td></tr>`;
                tbody.insertAdjacentHTML('beforeend', headerRow);

                levelGrades.forEach(grade => {
                    srNo += 1;
                    const hasScore = grade.score !== null && grade.score !== undefined && grade.score !== 'N/A';
                    const scoreLabel = hasScore ? grade.score : (grade.status || 'No Attempt');
                    const row = `<tr>
                <td>${srNo}</td>
                <td>${grade.courseName}</td>
                <td>${scoreLabel}</td>
            </tr>`;
                    tbody.insertAdjacentHTML('beforeend', row);

                    const status = String(grade.status || '').trim();
                    const hasAttempt = hasScore || ['Pass', 'Fail', 'Completed'].includes(status);
                    if (hasAttempt) {
                        attemptedCount += 1;
                        if (hasScore) scoredValues.push(parseFloat(grade.score) || 0);
                        if (status === 'Pass' || status === 'Completed') passCount += 1;
                    } else {
                        incompleteCount += 1;
                    }
                });
            });

            const totalScore = scoredValues.reduce((sum, v) => sum + v, 0);
            const meanScore = scoredValues.length > 0 ? (totalScore / scoredValues.length).toFixed(2) : 0;
            const overallResult = incompleteCount > 0
                ? (attemptedCount > 0 ? 'INCOMPLETE' : 'No Attempts Yet')
                : (attemptedCount > 0 && passCount === attemptedCount ? 'PASS' : (attemptedCount > 0 ? 'FAIL' : 'No Attempts Yet'));

            const totalRow = `<tr>
        <td colspan="2">Total</td>
        <td>${totalScore}</td>
    </tr>`;
            const meanPercentageRow = `<tr>
        <td colspan="2">Mean Percentage</td>
        <td>${meanScore}%</td>
    </tr>`;
            const levelRow = `<tr>
        <td colspan="2">Results</td>
        <td colspan="2">${overallResult}</td>
    </tr>`;

            tbody.insertAdjacentHTML('beforeend', totalRow);
            tbody.insertAdjacentHTML('beforeend', meanPercentageRow);
            tbody.insertAdjacentHTML('beforeend', levelRow);
        }

        // Function to display radar chart
        function displayRadarChart(grades) {
            const ctx = document.getElementById('radarChart').getContext('2d');

            // Filter out courses with N/A values
            const filteredGrades = grades.filter(grade => grade.posttest !== 'N/A');
            const courseNames = filteredGrades.map(grade => grade.courseName);
            const posttestScores = filteredGrades.map(grade => grade.posttest);

            // Modify each label object to include class
            // const labels = courseNames.map(courseName => {
            //     return {
            //         text: courseName,
            //         className: 'course-name'
            //     };
            // });

            const data = {
                //labels: labels, // Using labels with spans containing course names
                labels: courseNames,
                datasets: [
                    {
                        label: 'Score',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        data: posttestScores
                    }
                ]
            };

            const options = {
                scales: {
                    r: {
                        type: 'radialLinear',
                        min: 0,
                        max: 100,
                        ticks: {
                            beginAtZero: true,
                            stepSize: 10
                        },
                        angleLines: {
                            display: true
                        },
                        grid: {
                            //circular: true
                        },
                        pointLabels: {
                            display: true,
                            font: {
                                size: 15
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top'
                    }
                }
            };

            const radarChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: options
            });
        }

        // Function to download data in .xlsx format
        function downloadData() {
            const gradesTable = document.getElementById('gradesTable');
            const tableData = [];

            // Loop through table rows and cells to get data
            for (let i = 0; i < gradesTable.rows.length; i++) {
                const rowData = [];
                const row = gradesTable.rows[i];
                for (let j = 0; j < row.cells.length; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                tableData.push(rowData);
            }

            // Convert data to CSV format
            const csvContent = tableData.map(row => row.join(',')).join('\n');

            // Create a Blob object containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);

            // Set the filename for the download
            link.download = 'grades_data.csv';

            // Trigger the download
            link.click();
        }
        // Add event listener to the download button
        document.getElementById('downloadButton').addEventListener('click', downloadData);
