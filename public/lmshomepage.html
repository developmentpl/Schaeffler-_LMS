<script>
  // JavaScript to fetch and display the username
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const uniqueID = sessionStorage.getItem('uniqueID');
      const response = await fetch('/lmshomepage');
      const data = await response.text();
      const match = data.match(/<%= user.username %>/);
      console.log("User Unique ID:", uniqueID);
      if (match) {
        document.getElementById('usernamePlaceholder').textContent = match[1];
        console.log("User Unique ID:", uniqueID);
      }
    } catch (error) {
      console.error('Error fetching username:', error);
    }
  });
</script>
