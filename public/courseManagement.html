<!DOCTYPE html>
<html>

<head>
  <title>Course Management</title>
  <link rel="stylesheet" href="/styles/courseManagement.css">
  <style>
    /* * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    } */

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      margin: 0;
      padding: 0;

    }

    /* Animated background effects */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
      margin-top: 60px;
    }

    .page-header h1 {
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 10px;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      position: relative;
      z-index: 50;
    }

    .filter-container {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 12px 24px;
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .filter-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .filter-btn.active {
      background: rgba(34, 197, 94, 0.3);
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .mCourseName-dropdown {
      position: relative;
      display: inline-block;
      z-index: 100;
    }

    .dropdown-btn {
      padding: 12px 24px;
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .dropdown-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      min-width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 99999;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dropdown-content.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      transition: all 0.3s;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dropdown-content a:last-child {
      border-bottom: none;
    }

    .dropdown-content a:hover {
      background: rgba(59, 130, 246, 0.3);
      padding-left: 25px;
    }

    .filter-info {
      font-style: italic;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      padding: 8px 16px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .action-buttons {
      display: flex;
      gap: 15px;
    }

    .action-btn {
      padding: 12px 24px;
      background: rgba(34, 197, 94, 0.3);
      color: #ffffff;
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .action-btn:hover {
      background: rgba(34, 197, 94, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .course-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .course-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
    }

    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .course-title {
      font-size: 1.4rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .course-id {
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.5);
      backdrop-filter: blur(10px);
    }

    .course-date {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .course-date::before {
      content: '📅';
    }

    .course-description {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      display: -webkit-box;
      /* -webkit-line-clamp: 3;n  */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .course-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .meta-value {
      font-size: 0.95rem;
      color: #ffffff;
      font-weight: 600;
    }

    .course-actions {
      display: flex;
      gap: 10px;
    }

    .btn-enroll {
      flex: 1;
      padding: 10px 20px;
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-enroll:hover {
      background: rgba(59, 130, 246, 0.5);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .btn-delete {
      padding: 10px 20px;
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.5);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }

    .no-courses {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.2rem;
    }

    .no-courses::before {
      content: '📚';
      display: block;
      font-size: 4rem;
      margin-bottom: 20px;
      filter: grayscale(1) opacity(0.5);
    }

    .back-btn {
      position: fixed;
      top: 80px;
      left: 30px;
      padding: 15px 30px;
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      z-index: 1000;
      backdrop-filter: blur(20px);
    }

    .back-btn:hover {
      background: rgba(59, 130, 246, 0.5);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      margin: 10% auto;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 80%;
      max-width: 500px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .close {
      color: #ffffff;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .close:hover {
      color: rgba(239, 68, 68, 0.8);
      transform: scale(1.1);
    }

    .modal h2 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .modal form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal label {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .modal input[type="text"],
    .modal textarea,
    .modal select,
    .modal input[type="date"] {
      padding: 12px;
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .modal input[type="text"]:focus,
    .modal textarea:focus,
    .modal select:focus,
    .modal input[type="date"]:focus {
      outline: none;
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .modal textarea {
      resize: vertical;
      min-height: 80px;
    }

    .date-container {
      position: relative;
    }

    .calendar-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .modal input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      background: rgba(59, 130, 246, 0.5);
      border-radius: 5px;
    }

    .modal button[type="submit"] {
      padding: 12px;
      background: rgba(34, 197, 94, 0.3);
      color: #ffffff;
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      margin-top: 10px;
    }

    .modal button[type="submit"]:hover {
      background: rgba(34, 197, 94, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
    }

    @media (max-width: 768px) {
      .courses-grid {
        grid-template-columns: 1fr;
      }

      .controls-section {
        flex-direction: column;
        align-items: stretch;
      }

      .action-buttons {
        flex-direction: column;
      }

      .page-header h1 {
        font-size: 2rem;
      }

      .modal-content {
        width: 95%;
        margin: 5% auto;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="right-image">
      <img src="/Images/logo/finalmahindra.png" alt="Right Side Image" width="130" height="80">
    </div>

    <div class="navbar">
      <a href="/adminHomePage.html">Home</a>
      <a href="/logout" class="logout login-btn">Log Out</a>
    </div>

  </div>
  <div class="main-container">
    <div class="page-header">
      <h1>Course Management</h1>
    </div>


    <div class="controls-section">
      <div class="filter-container">
        <button onclick="showAllCourses()" class="filter-btn active" id="allCoursesBtn">All Courses</button>

        <div class="mCourseName-dropdown">
          <button class="dropdown-btn" id="mCourseNameBtn">Main Course ▼</button>
          <div class="dropdown-content" id="dropdownMenu">
            <!-- mCourseName will be loaded dynamically -->
          </div>
        </div>

        <span class="filter-info" id="filterInfo">Showing all courses</span>
      </div>

      <div class="action-buttons">
        <button onclick="redirectToAdminHomePage()" class="action-btn">Add Course</button>
        <button onclick="redirectToCreateCoursePage()" class="action-btn">Create New Course</button>
        <button onclick="window.location.href='/departmentManagement.html'" class="action-btn">Departments</button>
        <button onclick="window.location.href='/areaManagement.html'" class="action-btn">Segments / Areas</button>
        <button onclick="window.location.href='/processManagement.html'" class="action-btn">Processes / Lines</button>
      </div>
    </div>

    <div class="courses-grid" id="courseList">
      <!-- Course cards will be dynamically inserted here -->
    </div>
  </div>

  <!-- Add Main Course Modal -->
  <div id="addMainCourseModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAddMainCoursePopup()">&times;</span>
      <h2>Add Main Course</h2>
      <form id="addMainCourseForm">
        <label for="mName">Name:</label>
        <input type="text" id="mName" required>

        <label for="mDescription">Description:</label>
        <textarea id="mDescription" required></textarea>

        <label for="mDate">Date:</label>
        <div class="date-container">
          <input type="date" id="mDate" required>
          <span class="calendar-icon">📅</span>
        </div>

        <button type="submit">Add Main Course</button>
      </form>
    </div>
  </div>

  <div id="editCourseModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeEditCoursePopup()">&times;</span>
      <h2>Edit Course</h2>
      <form id="editCourseForm">
        <input type="hidden" id="editCourseID">

        <label for="editCourseName">Course:</label>
        <input type="text" id="editCourseName" readonly>

        <label for="editMainCourse">Main Course:</label>
        <select id="editMainCourse" required></select>

        <label for="editLevel">Tag / Level:</label>
        <select id="editLevel" required></select>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    &copy; Solution By Parallel Learning
  </footer>

  <script>
    let allCourses = [];
    let currentFilter = 'all';
    let mainCourseOptions = [];
    let levelOptions = [];

    // Add event listener to mCourseName button
    document.addEventListener('DOMContentLoaded', function () {
      const mCourseNameBtn = document.getElementById('mCourseNameBtn');
      if (mCourseNameBtn) {
        mCourseNameBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          const dropdown = document.getElementById('dropdownMenu');
          dropdown.classList.toggle('show');
        });
      }

      // Handle modal form submission
      const addForm = document.getElementById('addMainCourseForm');
      if (addForm) {
        addForm.addEventListener('submit', function (event) {
          event.preventDefault();
          const name = document.getElementById('mName').value.trim();
          const description = document.getElementById('mDescription').value.trim();
          const date = document.getElementById('mDate').value;

          console.log('Form data:', { name, description, date }); // Debug log

          if (!name || !description || !date) {
            alert('Please fill in all fields.');
            return;
          }

          fetch('/addMainCourse', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: name,
              description: description,
              date: date
            })
          })
            .then(response => response.json())
            .then(data => {
              if (data.success) {
                alert('Main Course added successfully!');
                closeAddMainCoursePopup();           // ← closes modal
                document.getElementById('addMainCourseForm').reset();
                fetchmCourseName();                   // refreshes dropdown
              } else {
                throw new Error(data.error || 'Unknown error');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('Error adding Main Course: ' + error.message);
          });
        });
      }

      const editForm = document.getElementById('editCourseForm');
      if (editForm) {
        editForm.addEventListener('submit', function (event) {
          event.preventDefault();

          const courseID = document.getElementById('editCourseID').value;
          const mCourseName = document.getElementById('editMainCourse').value;
          const level = document.getElementById('editLevel').value;

          if (!courseID || !mCourseName || !level) {
            alert('Please select both Main Course and Tag / Level.');
            return;
          }

          fetch('/updateCourseMainAndLevel', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ courseID, mCourseName, level })
          })
            .then(response => response.text().then(text => {
              let data;
              try {
                data = JSON.parse(text);
              } catch (error) {
                throw new Error(text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim() || 'Server returned a non-JSON response');
              }
              return { ok: response.ok, data };
            }))
            .then(({ ok, data }) => {
              if (!ok || !data.success) {
                throw new Error(data.error || 'Unable to update course');
              }

              alert('Course updated successfully!');
              closeEditCoursePopup();
              fetchCourseList();
            })
            .catch(error => {
              console.error('Error updating course:', error);
              alert('Error updating course: ' + error.message);
            });
        });
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById('addMainCourseModal');
        const editModal = document.getElementById('editCourseModal');
        if (event.target === modal) {
          closeAddMainCoursePopup();
        }
        if (event.target === editModal) {
          closeEditCoursePopup();
        }

        if (!event.target.matches('.dropdown-btn')) {
          const dropdowns = document.getElementsByClassName("dropdown-content");
          for (let i = 0; i < dropdowns.length; i++) {
            const openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
              openDropdown.classList.remove('show');
            }
          }
        }
      }
    });

    function openAddMainCoursePopup() {
      document.getElementById('addMainCourseModal').style.display = 'block';
    }

    function closeAddMainCoursePopup() {
      document.getElementById('addMainCourseModal').style.display = 'none';
    }

    function openEditCoursePopup(course) {
      document.getElementById('editCourseID').value = course.courseID;
      document.getElementById('editCourseName').value = `${course.courseName} (ID: ${course.courseID})`;
      populateEditDropdown('editMainCourse', mainCourseOptions, course.mCourseName || '');
      populateEditDropdown('editLevel', levelOptions, course.level || '');
      document.getElementById('editCourseModal').style.display = 'block';
    }

    function closeEditCoursePopup() {
      document.getElementById('editCourseModal').style.display = 'none';
    }

    function populateEditDropdown(selectId, options, selectedValue) {
      const select = document.getElementById(selectId);
      select.innerHTML = '';

      options.forEach(option => {
        const item = document.createElement('option');
        item.value = option.name;
        item.textContent = option.name;
        if (option.name === selectedValue) {
          item.selected = true;
        }
        select.appendChild(item);
      });

      if (selectedValue && !options.some(option => option.name === selectedValue)) {
        const currentOption = document.createElement('option');
        currentOption.value = selectedValue;
        currentOption.textContent = selectedValue;
        currentOption.selected = true;
        select.prepend(currentOption);
      }
    }

    function redirectToAdminHomePage() {
      window.location.href = "/index.html";
    }

    function redirectToCreateCoursePage() {
      window.location.href = "/createCourse.html";
    }

    function redirectToHierarchyPage() {
      window.location.href = "/departmentManagement.html";
    }

    function fetchCourseList() {
      fetch('/getCourseList')
        .then(response => response.json())
        .then(data => {
          console.log('Full Course Data from Backend:', data);
          allCourses = data;
          displayCourses(allCourses);
          updateFilterInfo(); // Adjusted to no parameters to match function signature
        })
        .catch(error => console.error('Error:', error));
    }

    function fetchmCourseName() {
      fetch('/getmCourseName')
        .then(response => response.json())
        .then(data => {
          console.log('mCourseName from Backend:', data);
          const dropdownMenu = document.getElementById('dropdownMenu');
          dropdownMenu.innerHTML = '';

          const mCourseNameList = data.mCourseName || [];
          mainCourseOptions = mCourseNameList;

          mCourseNameList.forEach(dept => {
            const link = document.createElement('a');
            link.textContent = dept.name;
            link.onclick = function () {
              filterBymCourseName(dept.name);
            };
            dropdownMenu.appendChild(link);
          });
        })
      // .catch(error => {
      //   console.error('Error fetching mCourseName:', error);
      //   const dropdownMenu = document.getElementById('dropdownMenu');
      //   dropdownMenu.innerHTML = `
      //     <a onclick="filterBymCourseName('Battery Pack Line 111')">Battery Pack Line</a>
      //     <a onclick="filterBymCourseName('Module Line')">Module Line</a>
      //   `;
      // });
    }

    function fetchLevels() {
      fetch('/getLevels')
        .then(response => response.json())
        .then(data => {
          levelOptions = data.levels || [];
        })
        .catch(error => console.error('Error fetching levels:', error));
    }

    function displayCourses(courses) {
      const courseListContainer = document.getElementById('courseList');
      courseListContainer.innerHTML = '';

      if (courses.length === 0) {
        courseListContainer.innerHTML = '<div class="no-courses">No courses found</div>';
        updateFilterInfo();
        return;
      }

      courses.forEach(course => {
        const deptValue = course.mCourseName || course.mCourseName || 'N/A';
        const levelValue = course.level || course.Level || course.courseLevel || 'N/A';

        const card = document.createElement('div');
        card.className = 'course-card';

        card.innerHTML = `
          <div class="course-header">
            <div>
              <div class="course-title">${course.courseName}</div>
              <div class="course-date">${course.courseDate}</div>
            </div>
            <div class="course-id">ID: ${course.courseID}</div>
          </div>
          
          <div class="course-description">${course.courseDescription}</div>
          
          <div class="course-meta">
            <div class="meta-item">
              <span class="meta-label">Process / Line</span>
              <span class="meta-value">${deptValue}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Level</span>
              <span class="meta-value">${levelValue}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Teacher</span>
              <span class="meta-value">${course.courseTeacher || 'N/A'}</span>
            </div>
          </div>
          
          <div class="course-actions">
            <button class="btn-enroll" onclick='viewScorm(${JSON.stringify(course)})'>Enroll Users</button>
            <button class="btn-enroll" onclick='openEditCoursePopup(${JSON.stringify(course)})'>Edit</button>
            <button class="btn-delete" onclick='deleteCourse(${JSON.stringify(course)})'>Delete</button>
          </div>
        `;

        courseListContainer.appendChild(card);
      });

      updateFilterInfo();
    }

    function showAllCourses() {
      currentFilter = 'all';
      displayCourses(allCourses);
      document.getElementById('allCoursesBtn').classList.add('active');
    }

    function filterBymCourseName(mCourseName) {
      currentFilter = mCourseName;
      const filteredCourses = allCourses.filter(course => {
        const courseNames = course.mCourseName || []; // Assume array
        return courseNames.includes(mCourseName); // Or courseNames.some(name => name.toLowerCase().includes(mCourseName.toLowerCase())) for partial match
      });
      displayCourses(filteredCourses);
      document.getElementById('allCoursesBtn').classList.remove('active');
      document.getElementById('dropdownMenu').classList.remove('show');
    }

    function updateFilterInfo() {
      const filterInfo = document.getElementById('filterInfo');
      if (!filterInfo) return; // Safety check
      const courseCount = document.querySelectorAll('.course-card').length;

      if (currentFilter === 'all') {
        filterInfo.textContent = `Showing all courses (${courseCount})`;
      } else {
        filterInfo.textContent = `Showing ${currentFilter} courses (${courseCount})`;
      }
    }

    function viewScorm(course) {
      window.location.href = `/courseDetailsPage.html?courseID=${course.courseID}`;
    }

    function deleteCourse(course) {
      if (confirm(`Are you sure you want to delete "${course.courseName}"?`)) {
        fetch('/deleteCourse', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ courseID: course.courseID })
        })
          .then(response => {
            if (response.ok) {
              alert("Course deleted successfully!");
              location.reload();
            } else {
              console.error('Error deleting course:', response.statusText);
            }
          })
          .catch(error => console.error('Error deleting course:', error));
      }
    }

    window.onload = function () {
      fetchCourseList();
      fetchmCourseName();
      fetchLevels();
    };

    function BackPage() {
      window.location.href = '/adminhomepage.html';
    }
  </script>
</body>

</html>
