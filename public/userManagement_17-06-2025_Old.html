                            console.log('Cell Value:', cellValue);

                    // Create a delete button and attach click event handler
                    const deleteButtonCell = document.createElement('td');

        // Function to delete user
        async function deleteUser(employeeID) {
            // Display confirmation dialog
            const confirmation = confirm('Are you sure you want to delete this user?');
            if (!confirmation) {
                return; // If the user cancels, do nothing
            }

            try {
                const response = await fetch('/deleteUser', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ employeeID }) // Pass the employeeID to the server
                });
                if (response.ok) {
                    alert('User deleted successfully');
                    console.log("User cha emp id:" + employeeID);
                    window.location.reload(); // Refresh the page after deletion
                } else {
                    const errorMessage = await response.text();
                    alert(`Failed to delete user: ${errorMessage}`);
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user. Please try again later.');
            }
        }


        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('userTable');
            const tr = table.getElementsByTagName('tr');
            const column = document.getElementById('searchColumn').value; // Get the value from the searchColumn input

            // Loop through all table rows, and hide those who don't match the search query
            for (let i = 0; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td')[column]; // Use the column index provided by the searchColumn input
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }


        // Function to download data in .xlsx format
        function downloadData() {
            const userTable = document.getElementById('userTable');
            const tableData = [];

            // Loop through table rows and cells to get data
            for (let i = 0; i < userTable.rows.length; i++) {
                const rowData = [];
                const row = userTable.rows[i];
                for (let j = 0; j < row.cells.length; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                tableData.push(rowData);
            }

            // Convert data to CSV format
            const csvContent = tableData.map(row => row.join(',')).join('\n');

            // Create a Blob object containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);

            // Set the filename for the download
            link.download = 'users_data.csv';

            // Trigger the download
            link.click();
        }
        // Add event listener to the download button
        document.getElementById('downloadButton').addEventListener('click', downloadData);

        // Add event listener to the edit button
        document.getElementById('editButton').addEventListener('click', function () {
            if (this.checked) {
                enableEdit();
            } else {
                disableEdit();
            }
        });

        // Add event listener to the save button
        document.getElementById('saveButton').addEventListener('click', function () {
            saveUserChanges();
        });


        // Function to enable editing for the entire table
        function enableEdit() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            cells.forEach(cell => {
                // Get the index of the cell's column
                const columnIndex = cell.cellIndex;
                if (columnIndex != 0 && columnIndex != 9 && columnIndex != 14) {
                    cell.contentEditable = true;
                }
            });
            // Show the save button
            document.getElementById('saveButton').style.display = 'inline-block';
        }

        //Disable Edidting for entire table
        function disableEdit() {
            //location.reload();
            const cells = document.querySelectorAll('td:not(.employeeID)');
            cells.forEach(cell => {
                cell.contentEditable = false;
            });

            // Hide the save button
            //checkb = true;
            document.getElementById('saveButton').style.display = 'none';
        }


        // Function to save changes
        function saveUserChanges() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            const updatedData = [];

            // Iterate through cells to collect updated data
            cells.forEach(cell => {
                const columnIndex = cell.cellIndex;
                if (columnIndex != 0 && columnIndex != 9 && columnIndex != 14) {
                    updatedData.push({
                        employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                        columnName: cell.dataset.column, // Get the column name from the data attribute
                        newValue: cell.textContent.trim() // Get the new value after editing
                    });
                }

            });

            // Show confirmation alert before saving
            const confirmSave = confirm("Are you sure you want to save the changes?");
            if (!confirmSave) {
                location.reload();
                return; // Do not proceed with saving if user clicks "Cancel"
            }

            // Send updated data to the server
            updateUserDatabase(updatedData);

            // Send updated data to the server
            fetch('/userDetailsSaveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');
                        location.reload();
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Error saving changes:', error);
                });
            document.getElementById('saveButton').style.display = 'none';
        }
        // Function to update the database with edited data
        function updateUserDatabase(updatedData) {
            // Send the updatedData to the server using AJAX or fetch
            fetch('/userDetailsSaveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Error saving changes:', error);
                });
        }
