    <script>
        checkb = "true";
        function findCourseInfoForUser(user, courseNamesData) {
            // Iterate over courseNamesData to find the correct course information for the user
            for (let i = 0; i < courseNamesData.length; i++) {
                const course = courseNamesData[i];
                // Check if the courseID matches the one in the user data
                if (course.courseID === user.courseID) {
                    return {
                        courseID: course.courseID,
                        courseName: course.courseName
                    };
                }
            }
            // Return a default value if no match is found
            return {
                courseID: '',
                courseName: ''
            };
        }

        // JavaScript to fetch and display the username and grades data
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch course names from the server
                const courseNamesResponse = await fetch('/courseNames');
                const courseNamesData = await courseNamesResponse.json();
                console.log(courseNamesData);

                // Extract course names and IDs from the data
                const courseNames = courseNamesData.map(course => ({
                    courseID: course.courseID,
                    courseName: course.courseName
                }));

                const numCourses = courseNames.length;

                // Generate table headers for Pretest and Posttest based on course names
                const tableHeaderRow = document.querySelector('#gradesTable thead tr');

                for (let i = 0; i < numCourses; i++) {
                    const courseId = courseNames[i].courseID;
                    const courseName = courseNames[i].courseName;
                    tableHeaderRow.innerHTML += `<th class="hiddenColumn">uCourse${i}</th><th>${courseName} - Pretest</th><th>${courseName} - Posttest</th>`;
                }

                // Append the Level column header at the end
                tableHeaderRow.innerHTML += `<th>Level</th>`;

                // Fetch grades data
                const gradesDataResponse = await fetch('/gradesData');
                const gradesData = await gradesDataResponse.json();
                const gradesDataContainer = document.getElementById('gradesData');

                gradesData.forEach((user, index) => {
                    const row = document.createElement('tr');

                    // Insert serial number
                    const serialNumberCell = document.createElement('td');
                    serialNumberCell.textContent = index + 1;
                    row.appendChild(serialNumberCell);

                    // Get all keys (column names) from the user object
                    const columns = Object.keys(user);

                    // Specify the order of columns to match the order in the table header
                    const columnsOrder = ['name', 'uName', 'employeeID'];
                    for (let i = 1; i <= numCourses; i++) {
                        columnsOrder.push(`uCourse${i}`, `course${i}Pretest`, `course${i}Posttest`);
                    }

                    // Insert data into the table cells in the correct order
                    columnsOrder.forEach(column => {
                        const cell = document.createElement('td');
                        cell.textContent = user[column];
                        // Add data-column attribute to specify the column name
                        cell.dataset.column = column;

                        if (column.startsWith('uCourse') || column.endsWith('Pretest') || column.endsWith('Posttest')) {
                            const courseIndex = parseInt(column.replace(/\D/g, '')); // Extract course index from column name
                            const course = courseNames[courseIndex - 1]; // Get course information based on index
                            cell.dataset.courseID = course.courseID;
                            cell.dataset.courseName = course.courseName;
                        }

                        // Assign a class to the employeeID cell
                        if (column === 'employeeID') {
                            cell.classList.add('employeeID');
                        }
                        row.appendChild(cell);
                    });

                    let totalPosttest = 0;
                    let numberOfPosttests = 0;
                    for (let i = 1; i <= numCourses; i++) {
                        const posttestScore = parseFloat(user[`course${i}Posttest`]);
                        if (!isNaN(posttestScore)) {
                            totalPosttest += posttestScore;
                            numberOfPosttests++;
                        }
                    }

                    const averagePosttest = numberOfPosttests > 0 ? (totalPosttest / numberOfPosttests) : 0;
                    let level = "FAIL";  // Default level
                    if (averagePosttest >= 90) {
                        level = "L4";
                    } else if (averagePosttest >= 80) {
                        level = "L3";
                    } else if (averagePosttest >= 70) {
                        level = "L2";
                    } else if (averagePosttest >= 60) {
                        level = "L1";
                    }
                    // Debugging output
                    console.log(`User: ${user.uName} | Total Posttest: ${totalPosttest} | Average: ${averagePosttest.toFixed(2)}% | Level: ${level}`);


                    const levelCell = document.createElement('td');
                    levelCell.textContent = level;
                    levelCell.classList.add('level-cell');
                    row.appendChild(levelCell);

                    gradesDataContainer.appendChild(row);
                });
                // Add event listener to each table cell
                const cells = document.querySelectorAll('td:not(.employeeID)');
                cells.forEach(cell => {
                    cell.addEventListener('click', function () {
                        const employeeID = cell.parentElement.querySelector('.employeeID').textContent;
                        const columnName = cell.dataset.column; // Get column name from data attribute
                        const cellValue = cell.textContent.trim(); // Get cell value

                        // Get the course name and ID from the column name
                        const clickedCourseIndex = parseInt(columnName.replace(/[^\d]/g, '')); // Extract course index from column name
                        const clickedCourse = courseNames[clickedCourseIndex - 1]; // courseNames is assumed to be available globally

                        const courseID = clickedCourse.courseID;
                        const courseName = clickedCourse.courseName;

                        console.log('Employee ID:', employeeID);
                        console.log('Column Name:', columnName);
                        console.log('Cell Value:', cellValue);
                        console.log('Course ID:', courseID);
                        console.log('Course Name:', courseName);
                        console.log('CourseName:', courseNames);

                    });
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }

            // Add event listener to each employeeID cell
            const employeeIDCells = document.querySelectorAll('td:nth-child(4)');
            employeeIDCells.forEach(cell => {
                cell.addEventListener('click', async () => {
                    // Extract employeeID from the clicked cell
                    const employeeID = cell.textContent;
                    try {
                        // Fetch data for the clicked employeeID
                        const response = await fetch(`/getUserGrades?employeeID=${employeeID}`);
                        const data = await response.json();
                        // Redirect to userGradesReport.html with the fetched data
                        window.location.href = `/userGradesReport.html?employeeID=${employeeID}`;
                    } catch (error) {
                        console.error('Error fetching user data:', error);
                    }
                });
            });
        });


        function redirectToAdminHomePage() {
            window.location.href = "/adminHomePage.html";

        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('gradesTable');
            const tr = table.getElementsByTagName('tr');
            const column = document.getElementById('searchColumn').value;
            for (let i = 0; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td')[column]; // Use the column index provided by the searchColumn input
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }


        // Function to download data in .xlsx format
        function downloadData() {
            const gradesTable = document.getElementById('gradesTable');
            const tableData = [];

            // Loop through table rows and cells to get data
            for (let i = 0; i < gradesTable.rows.length; i++) {
                const rowData = [];
                const row = gradesTable.rows[i];
                for (let j = 0; j < row.cells.length; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                tableData.push(rowData);
            }

            // Convert data to CSV format
            const csvContent = tableData.map(row => row.join(',')).join('\n');

            // Create a Blob object containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);

            // Set the filename for the download
            link.download = 'grades_data.csv';

            // Trigger the download
            link.click();
        }
        // Add event listener to the download button
        document.getElementById('downloadButton').addEventListener('click', downloadData);

        document.getElementById('editButton').addEventListener('click', function () {

        // Function to enable editing for the entire table
        function enableEdit() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            cells.forEach(cell => {
                // Get the index of the cell's column
                const columnIndex = cell.cellIndex;
                const columnCount = cell.parentElement.children.length;
                if (columnIndex < columnCount - 1) {
                    // Exclude certain other columns from being editable if needed
                    if (!['id', 'name', 'uName', 'employeeID'].includes(cell.dataset.column)) {
                        cell.contentEditable = true;
                        // Add event listener for Tab key press to handle tab navigation within editable cells
                        cell.addEventListener('keydown', function (event) {
                            if (event.key === 'Tab') {
                                event.preventDefault(); // Prevent the default Tab behavior
                                let nextCell = cell.nextElementSibling;
                                while (nextCell) {
                                    if (nextCell.cellIndex < columnCount - 1 && !['id', 'name', 'uName', 'employeeID'].includes(nextCell.dataset.column)) {
                                        nextCell.focus(); // Focus the next editable cell
                                        break;
                                    }
                                    nextCell = nextCell.nextElementSibling;
                                }
                            }
                        });
                    }
                } else {
                    cell.contentEditable = false; // Ensure the Level column is not editable
                }
            });
            // Show the save button
            document.getElementById('saveButton').style.display = 'inline-block';
            //checkb = false;
        }

        //Disable Edidting for entire table
        function disableEdit() {
            //location.reload();
            const cells = document.querySelectorAll('td:not(.employeeID):not(:last-child)');
            cells.forEach(cell => {
                cell.contentEditable = false;
            });

            // Hide the save button
            //checkb = true;
            document.getElementById('saveButton').style.display = 'none';
        }
        
        function saveChanges() {
            const cells = document.querySelectorAll('td:not(.employeeID):not(:last-child)');
            const updatedData = [];
            cells.forEach((cell, user) => {
                // Skip the first three columns (Sr No, Name, Username)
                if (cell.cellIndex > 0 && !['id', 'name', 'uName', 'employeeID'].includes(cell.dataset.column)) {
                    console.log('Cell Data:', cell.dataset);
                    // Get the new value after editing
                    const newValue = cell.textContent.trim();
                    const columnName = cell.dataset.column;
                    if (newValue !== '') { // Check if newValue is not empty
                        updatedData.push({
                            employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                            columnName: columnName,
                            newValue: newValue,
                            courseID: cell.dataset.courseID,
                            courseName: cell.dataset.courseName
                        });
                    }
                    else { // If cell value is cleared, clear the corresponding uCourseX value
                        if (columnName.endsWith('Pretest') || columnName.endsWith('Posttest')) {
                            const courseNumber = columnName.match(/\d+/)[0];
                            const uCourseCell = cell.parentElement.querySelector(`[data-column="uCourse${courseNumber}"]`);
                            const courseXPretestCell = cell.parentElement.querySelector(`[data-column="course${courseNumber}Pretest"]`);
                            const courseXPosttestCell = cell.parentElement.querySelector(`[data-column="course${courseNumber}Posttest"]`);

                            // Check if both courseXPretest and courseXPosttest are cleared or one is cleared while the other is null
                            if ((newValue === '' && courseXPosttestCell.textContent === '') ||
                                (newValue === '' && courseXPosttestCell.textContent === 'null') ||
                                (courseXPretestCell.textContent === '' && newValue === '') ||
                                (courseXPretestCell.textContent === 'null' && newValue === '')) {
                                uCourseCell.textContent = ''; // Clear the uCourseX cell
                                updatedData.push({
                                    employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                                    columnName: `uCourse${courseNumber}`,
                                    newValue: null, // Clear the corresponding uCourseX value
                                    courseID: cell.dataset.courseID,
                                    courseName: null
                                });
                            }

                            // Also clear the courseXPretest or courseXPosttest cell
                            if (newValue !== null) {
                                updatedData.push({
                                    employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                                    columnName: columnName,
                                    newValue: null, // Set the courseXPretest or courseXPosttest value to null
                                    courseID: cell.dataset.courseID,
                                    courseName: null // Set courseName to null
                                });
                            }
                        }
                    }

                }
            });
            console.log('Updated data:', updatedData);
            // Check if there are any changes to save
            if (updatedData.length === 0) {
                console.log('No changes to save.');
                return;
            }
            const confirmSave = confirm("Are you sure you want to save the changes?");
            if (!confirmSave) {
                location.reload();
                return; // Do not proceed with saving if user clicks "Cancel"
            }
            else {
                // Send updated data to the server
                updatedData.forEach(data => {
                    console.log('Calling updateDatabase with:', data.employeeID, data.columnName, data.newValue, data.courseName);
                    updateDatabase(data.employeeID, data.columnName, data.newValue, data.courseName);
                });

                // Send updated data to the server
                fetch('/saveChanges', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ updatedData: updatedData })
                })
                    .then(response => {
                        if (response.ok) {
                            console.log('Changes saved successfully');
                            // Update uCourseX cells based on course Pretest and Posttest values after saving changes
                            updatedData.forEach(entry => {
                                const columnName = entry.columnName;
                                const newValue = entry.newValue;
                                const courseName = entry.courseName;

                                // Check if the column corresponds to a course Pretest or Posttest
                                if (columnName && columnName.startsWith('course') && (columnName.endsWith('Pretest') || columnName.endsWith('Posttest'))) {
                                    const courseNumber = columnName.match(/\d+/)[0]; // Extract the course number from the column name (e.g., 'course1')

                                    // Get the corresponding uCourseX cell
                                    const uCourseCell = document.querySelector(`[data-column="uCourse${courseNumber}"]`);

                                    // If the entered value is not empty, undefined, or null, fill the corresponding uCourseX cell with the courseName
                                    if (newValue && newValue.trim() !== '' && newValue.trim() !== undefined && newValue.trim() !== null) {
                                        uCourseCell.textContent = courseName; // Fill the uCourseX cell with the courseName
                                    } else {
                                        uCourseCell.textContent = ''; // Clear the uCourseX cell if the entered value is empty, undefined, or null
                                    }
                                }
                            });
                            location.reload();
                        } else {
                            throw new Error('Failed to save changes');
                        }
                    })
                    .catch(error => {
                        console.error('Error saving changes:', error);
                    });
                document.getElementById('saveButton').style.display = 'none';
            }

        }
        function updateDatabase(updatedData) {
            // Send the updatedData to the server using AJAX or fetch
            fetch('/saveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ updatedData: updatedData })
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Error saving changes:', error);
                });
        }

        function addCourseTestClasses() {
            const courseCells = document.querySelectorAll('[data-column^="course"]');
            courseCells.forEach(cell => {
                const columnName = cell.dataset.column;
                if (columnName.endsWith('Pretest')) {
                    cell.classList.add('pretest-cell');
                    const courseNumber = columnName.match(/\d+/)[0];
                    cell.classList.add(`course${courseNumber}-pretest`);
                } else if (columnName.endsWith('Posttest')) {
                    cell.classList.add('posttest-cell');
                    const courseNumber = columnName.match(/\d+/)[0];
                    cell.classList.add(`course${courseNumber}-posttest`);
                }
            });
        }

        function sortTableByName() {
            let table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            table = document.getElementById("gradesTable");
            switching = true;
            // Set the sorting direction to ascending:
            dir = "asc";
            // Make a loop that will continue until no switching has been done:
            while (switching) {
                // Start by saying: no switching is done:
                switching = false;
                rows = table.rows;
                // Loop through all table rows (except the first, which contains table headers):
                for (i = 1; i < (rows.length - 1); i++) {
                    // Start by saying there should be no switching:
                    shouldSwitch = false;
                    // Get the two elements you want to compare, one from current row and one from the next:
                    x = rows[i].getElementsByTagName("TD")[1]; // Adjust index as per your table structure for Name
                    y = rows[i + 1].getElementsByTagName("TD")[1];
                    // Check if the two rows should switch place, based on the direction, asc or desc:
                    if (dir == "asc") {
                        if (x.textContent.toLowerCase() > y.textContent.toLowerCase()) {
                            // If so, mark as a switch and break the loop:
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir == "desc") {
                        if (x.textContent.toLowerCase() < y.textContent.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    // If a switch has been marked, make the switch and mark that a switch has been done:
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }


        function sortTableByTokenId() {
            let table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            table = document.getElementById("gradesTable");
            switching = true;
            dir = "asc";
            while (switching) {
                switching = false;
                rows = table.rows;
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[3]; // Adjust index for Employee ID
                    y = rows[i + 1].getElementsByTagName("TD")[3];
                    if (dir == "asc") {
                        if (Number(x.textContent) > Number(y.textContent)) {
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir == "desc") {
                        if (Number(x.textContent) < Number(y.textContent)) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }


        function sortTableById() {
            let table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            table = document.getElementById("gradesTable");
            switching = true;
            dir = "asc";  // Initially set the direction to ascending
            // Continue until no switching is needed
            while (switching) {
                switching = false;
                rows = table.rows;
                // Loop through all rows except for the first (header row)
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    // Compare two adjacent rows
                    x = rows[i].getElementsByTagName("TD")[0]; // Adjust the index according to your table structure for "Sr No"
                    y = rows[i + 1].getElementsByTagName("TD")[0];
                    // Determine if the rows should switch places
                    if (dir == "asc") {
                        if (Number(x.textContent) > Number(y.textContent)) {
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir == "desc") {
                        if (Number(x.textContent) < Number(y.textContent)) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    // Make the switch and mark that a switch has been done
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }

        document.getElementById('levelSort').addEventListener('change', function () {
            let selectedLevel = this.value;
            let table = document.getElementById('gradesTable');
            let tbody = table.getElementsByTagName('tbody')[0];
            let rows = Array.from(tbody.getElementsByTagName('tr'));

            if (selectedLevel === "all") {
                rows.forEach(row => row.style.display = "");
            } else {
                rows.forEach(row => {
                    let levelCell = row.cells[row.cells.length - 1]; // Assumes Level is the last column
                    if (levelCell.textContent === selectedLevel) {
                        row.style.display = ""; // Show rows that match the level
                    } else {
                        row.style.display = "none"; // Hide rows that do not match
                    }
                });
            }
        });
