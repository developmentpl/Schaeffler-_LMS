<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical Evaluation - Eligible Users</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f7fb;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(8, 149, 76, 0.08), transparent 40%),
        radial-gradient(circle at 90% 95%, rgba(8, 149, 76, 0.08), transparent 40%);
      background-attachment: fixed;
    }
    .header { flex-shrink: 0; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid #d9e1ec; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    .brand-logo img { display: block; width: 280px; max-width: 38vw; height: auto; }
    .navbar a { margin-left: 20px; color: #172033; text-decoration: none; font-weight: 700; }
    .navbar a:hover { color: #08954c; }
    main { flex: 1 0 auto; max-width: 1000px; width: 100%; margin: 0 auto; padding: 28px 20px 40px; box-sizing: border-box; }
    h1 { margin: 0 0 6px; font-size: 28px; color: #101828; }
    p.lead { color: #44526b; margin: 0 0 18px; line-height: 1.5; }
    .status { min-height: 22px; margin-bottom: 12px; font-weight: 700; color: #08954c; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e6edf5; font-size: 14px; }
    th { background: #f7f9fc; color: #44526b; }
    tr.userRow { cursor: pointer; }
    tr.userRow:hover { background: #eef8f1; }
    .badge { display: inline-block; border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: #fff3cd; color: #8a6500; }
    .empty { color: #6b7a90; font-style: italic; padding: 20px; text-align: center; }
    footer { flex-shrink: 0; text-align: center; padding: 24px; background-color: #ffffff; color: #000000; border-top: 1px solid #e4e7ec; }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand-logo"><img src="/Images/logo/Schaeffler_green_HKS_57N-01.png" alt="Schaeffler Logo"></div>
    <div class="navbar">
      <a href="/practicalEvaluation.html">Practical Evaluation</a>
      <a href="/adminHomePage.html">Home</a>
      <a href="/logout">Log Out</a>
    </div>
  </div>

  <main>
    <h1 id="courseTitle">Eligible Users</h1>
    <p class="lead">Users below have not yet had their Practical evaluation submitted for this course. Click a name to open their OJT Observance &amp; Evaluation form.</p>
    <div class="status" id="status"></div>

    <table>
      <thead><tr><th>Name</th><th>Employee ID</th><th>Username</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
    </table>
  </main>

  <footer>
    <p>&copy; Solution By Parallel Learning</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const subCourseID = params.get('subCourseID');
    const courseName = params.get('courseName') || '';
    const statusEl = document.getElementById('status');
    const rowsEl = document.getElementById('rows');

    document.getElementById('courseTitle').textContent = courseName ? `Eligible Users - ${courseName}` : 'Eligible Users';

    function setStatus(message, isError) {
      statusEl.textContent = message || '';
      statusEl.style.color = isError ? '#b42318' : '#08954c';
    }

    function openUser(uniqueID) {
      const p = new URLSearchParams({ subCourseID, uniqueID, courseName });
      window.location.href = `/practicalEvaluationForm.html?${p.toString()}`;
    }

    async function load() {
      if (!subCourseID) {
        setStatus('No course specified.', true);
        rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No course specified.</td></tr>';
        return;
      }
      try {
        const response = await fetch(`/api/practical/eligibleUsers?subCourseID=${encodeURIComponent(subCourseID)}`);
        const data = await response.json();
        if (!response.ok || data.success === false) throw new Error(data.error || 'Request failed');

        const users = data.users || [];
        if (!users.length) {
          rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No eligible users remaining - everyone has been evaluated and submitted.</td></tr>';
          setStatus('');
          return;
        }
        setStatus(`${users.length} eligible user(s).`);
        rowsEl.innerHTML = '';
        users.forEach(u => {
          const tr = document.createElement('tr');
          tr.className = 'userRow';
          tr.innerHTML = `
            <td>${u.name || ''}</td>
            <td>${u.employeeID || ''}</td>
            <td>${u.uName || ''}</td>
            <td>${u.refresherRequired ? '<span class="badge">Refresher due</span>' : (u.hasDraft ? '<span class="badge">Draft saved</span>' : '')}</td>
          `;
          tr.addEventListener('click', () => openUser(u.uniqueID));
          rowsEl.appendChild(tr);
        });
      } catch (error) {
        setStatus(error.message, true);
        rowsEl.innerHTML = `<tr><td colspan="4" class="empty">${error.message}</td></tr>`;
      }
    }

    load();
  </script>
</body>

</html>
