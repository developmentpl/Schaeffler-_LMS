        async function fetchUsers(page) {
            try {
                const res = await fetch(`/userData?page=${page}&limit=${limit}`);
                const data = await res.json();
                const users = data.users;
                totalUsers = data.total;

                const userDataContainer = document.getElementById('userData');
                userDataContainer.innerHTML = '';
                let serialNumber = (page - 1) * limit + 1;

                users.forEach(user => {
                    const row = document.createElement('tr');
                    const serialCell = document.createElement('td');
                    serialCell.textContent = serialNumber++;
                    row.appendChild(serialCell);

                    const columnsOrder = ['uniqueID', 'name', 'emailID', 'employeeID', 'uName', 'uPass', 'mobileNo', 'dateOfBirth', 'address', 'photo', 'dateOfJoining', 'department', 'Contract', 'Qualification', 'uRole', 'currentDate'];

                    columnsOrder.forEach(column => {
                        const cell = document.createElement('td');
                        if (column === 'photo') {
                            const img = document.createElement('img');
                            img.src = `/photos/${user[column]}`;
                            img.style.width = '50px';
                            cell.appendChild(img);
                        } else {
                            cell.textContent = user[column];
                            cell.dataset.column = column;
                            if (column === 'uniqueID') cell.classList.add('uniqueID');
                            if (column === 'name') {
                                cell.id = 'nameIDCell';
                                cell.classList.add('name');
                            }
                        }
                        row.appendChild(cell);

                    });

                    const deleteButtonCell = document.createElement('td');
                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', () => deleteUser(user['uniqueID']));
                    deleteButtonCell.appendChild(deleteButton);
                    row.appendChild(deleteButtonCell);

                    userDataContainer.appendChild(row);
                });

                // attachCellListeners();
                const cells = document.querySelectorAll('td:not(.uniqueID)');
                cells.forEach(cell => {
                    cell.addEventListener('click', function () {
                        const uniqueID = cell.parentElement.querySelector('.uniqueID').textContent;
                        const columnName = cell.dataset.column;
                        const cellValue = cell.textContent.trim();
                        console.log('uniqueID ID:', uniqueID);
                        console.log('Column Name:', columnName);
                        console.log('Cell Value:', cellValue);
                    });
                });
                renderPagination();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function renderPagination() {
            const totalPages = Math.ceil(totalUsers / limit);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const prev = document.createElement('button');
            prev.textContent = '<< Prev';
            prev.disabled = currentPage === 1;
            prev.onclick = () => {
                currentPage--;
                fetchUsers(currentPage);



            };
            pagination.appendChild(prev);

            const pageInfo = document.createElement('span');
            pageInfo.textContent = ` Page ${currentPage} of ${totalPages} `;
            pageInfo.style.margin = '0 10px';
            pagination.appendChild(pageInfo);

            const next = document.createElement('button');
            next.textContent = 'Next >>';
            next.disabled = currentPage === totalPages;
            next.onclick = () => {
                currentPage++;
                fetchUsers(currentPage);


            };

            pagination.appendChild(next);

        }

        // Function to delete user
        async function deleteUser(uniqueID) {
            // Display confirmation dialog
            const confirmation = confirm('Are you sure you want to delete this user?');
            if (!confirmation) {
                return; // If the user cancels, do nothing
            }

            try {
                const response = await fetch('/deleteUser', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ uniqueID }) // Pass the uniqueID to the server
                });
                if (response.ok) {
                    alert('User deleted successfully');
                    console.log("User cha emp id:" + uniqueID);
                    window.location.reload(); // Refresh the page after deletion
                } else {
                    const errorMessage = await response.text();
                    alert(`Failed to delete user: ${errorMessage}`);
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user. Please try again later.');
            }
        }

        async function searchUsers() {
            const input = document.getElementById('searchInput').value;
            if (!input.trim()) {
                fetchUsers(currentPage); // fallback to default paginated data
                return;
            }

            try {
                const response = await fetch(`/searchUsers?term=${encodeURIComponent(input)}`);
                const users = await response.json();
                totalUsers = users.length;
                const userDataContainer = document.getElementById('userData');
                userDataContainer.innerHTML = '';
                let serialNumber = 1;

                users.forEach(user => {
                    const row = document.createElement('tr');
                    const serialCell = document.createElement('td');
                    serialCell.textContent = serialNumber++;
                    row.appendChild(serialCell);

                    const columnsOrder = ['uniqueID', 'name', 'emailID', 'employeeID', 'uName', 'uPass', 'mobileNo', 'dateOfBirth', 'address', 'photo', 'dateOfJoining', 'department', 'Contract', 'Qualification', 'uRole', 'currentDate'];

                    columnsOrder.forEach(column => {
                        const cell = document.createElement('td');
                        if (column === 'photo') {
                            const img = document.createElement('img');
                            img.src = `/photos/${user[column]}`;
                            img.style.width = '50px';
                            cell.appendChild(img);
                        } else {
                            cell.textContent = user[column];
                            cell.dataset.column = column;
                            if (column === 'uniqueID') cell.classList.add('uniqueID');
                        }
                        row.appendChild(cell);
                    });

                    const deleteButtonCell = document.createElement('td');
                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.onclick = () => deleteUser(user['uniqueID']);
                    deleteButtonCell.appendChild(deleteButton);
                    row.appendChild(deleteButtonCell);

                    userDataContainer.appendChild(row);
                });

            } catch (error) {
                console.error('Error searching users:', error);
            }
        }



        // Function to download data in .xlsx format
        async function downloadData() {
            try {
                const response = await fetch('/api/users-csv');
                if (!response.ok) throw new Error('Failed to fetch CSV');

                const csvData = await response.text(); // get CSV as plain text

                const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'users_data.csv';
                link.click();
            } catch (error) {
                console.error('Download error:', error);
                alert('Failed to download user data.');
            }
        }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'users_data.csv';
                link.click();
            } catch (error) {
                console.error('Error downloading CSV:', error);
                alert('Failed to download user data.');
            }
        });

        // Function to enable editing for the entire table
        function enableEdit() {
            const cells = document.querySelectorAll('td:not(.uniqueID)');
            cells.forEach(cell => {
                // Get the index of the cell's column
                const columnIndex = cell.cellIndex;
                if (columnIndex != 0 && columnIndex != 10 && columnIndex != 17) {
                    cell.contentEditable = true;
                }
            });
            // Show the save button
            document.getElementById('saveButton').style.display = 'inline-block';
        }

        //Disable Edidting for entire table
        function disableEdit() {
            //location.reload();
            const cells = document.querySelectorAll('td:not(.uniqueID)');

            cells.forEach(cell => {
                cell.contentEditable = false;
            });

            // Hide the save button
            //checkb = true;
            document.getElementById('saveButton').style.display = 'none';
        }

        //---------------new one
        function saveUserChanges() {
            const cells = document.querySelectorAll('td:not(.uniqueID)');

            const updatedData = [];

            // Collect updated data
            cells.forEach(cell => {
                const columnIndex = cell.cellIndex;
                if (columnIndex != 0 && columnIndex != 10 && columnIndex != 17) {
                    updatedData.push({
                        uniqueID: cell.parentElement.querySelector('.uniqueID').textContent,
                        columnName: cell.dataset.column,
                        newValue: cell.textContent.trim()
                    });
                }
            });

            // Confirmation
            const confirmSave = confirm("Are you sure you want to save the changes?");
            if (!confirmSave) {
                location.reload();
                return;
            }

            // Send data to server
            fetch('/userDetailsSaveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');

                        // Turn off toggle and disable edit mode
                        document.getElementById('editButton').checked = true;
                        disableEdit();

                        // Hide save button
                        document.getElementById('saveButton').style.display = 'none';

                        // Optional delay to allow UI to reflect changes before reload
                        setTimeout(() => {
                            location.reload();
                        }, 300);
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Updated data:', updatedData);
                    console.error('Error saving changes:', error);
                });
        }
