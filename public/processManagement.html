<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process / Line Management</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f7fb;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(8, 149, 76, 0.08), transparent 40%),
        radial-gradient(circle at 90% 95%, rgba(8, 149, 76, 0.08), transparent 40%);
      background-attachment: fixed;
    }
    .header { flex-shrink: 0; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid #d9e1ec; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    .brand-logo img { display: block; width: 280px; max-width: 38vw; height: auto; }
    .navbar a { margin-left: 20px; color: #172033; text-decoration: none; font-weight: 700; }
    .navbar a:hover { color: #08954c; }
    main { flex: 1 0 auto; max-width: 1100px; width: 100%; margin: 0 auto; padding: 28px 20px 112px; box-sizing: border-box; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar a { background: #fff; border: 1px solid #d9e1ec; color: #172033; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-weight: 700; transition: background .15s ease; }
    .toolbar a:hover { background: #e6f5ec; color: #08954c; }
    .layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    .panel { background: #fff; border: 1px solid #d9e1ec; border-radius: 10px; padding: 18px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .panel-head h2 { margin: 0; }
    #openAddBtn { width: auto; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(16, 24, 40, 0.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #fff; border-radius: 10px; padding: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(16, 24, 40, 0.25); position: relative; }
    .modal-close { position: absolute; top: 10px; right: 10px; width: auto; background: transparent; color: #6b7a90; font-size: 20px; line-height: 1; padding: 4px 10px; box-shadow: none; }
    .modal-close:hover { color: #101828; background: #f0f5fb; transform: none; box-shadow: none; }
    h1 { margin: 0 0 16px; font-size: 30px; color: #101828; }
    h2 { margin: 0 0 14px; font-size: 18px; color: #101828; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
    input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #b9c7d8; border-radius: 6px; padding: 10px 12px; font: inherit; }
    textarea { min-height: 82px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; background: linear-gradient(135deg, #0b3320, #08954c); color: #fff; font-weight: 700; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(8, 149, 76, 0.3); }
    button.delete { background: #b42318; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #f0f5fb; }
    form button { width: 100%; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6edf5; vertical-align: top; }
    th { background: #f7f9fc; }
    .status { min-height: 22px; margin-bottom: 12px; font-weight: 700; color: #08954c; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; text-align: center; padding: 24px; background-color: #ffffff; color: #000000; border-top: 1px solid #e4e7ec; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04); }
    footer p { margin: 0; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand-logo"><img src="/Images/logo/Schaeffler_green_HKS_57N-01.png" alt="Schaeffler Logo"></div>
    <div class="navbar">
      <a href="/adminHomePage.html">Home</a>
      <a href="/courseManagement.html">Course Management</a>
      <a href="/logout">Log Out</a>
    </div>
  </div>

  <main>
    <h1>Process / Line Management</h1>
    <div class="toolbar">
      <a href="/departmentManagement.html">Department</a>
      <a href="/areaManagement.html">Segment / Area</a>
      <a href="/stationManagement.html">Station</a>
      <!-- <a href="/createCourse.html">Create Course</a> -->
    </div>
    <div class="status" id="status"></div>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Processes / Lines</h2>
          <button type="button" id="openAddBtn">+ Add Process / Line</button>
        </div>
        <table>
          <thead>
            <tr><th>Name</th><th>Level</th><th>Department</th><th>Segment</th><th>Action</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="formModal">
    <div class="modal-card">
      <button type="button" class="modal-close" id="modalCloseBtn" title="Close">&times;</button>
      <h2 id="formTitle">Add Process / Line</h2>
      <form id="form">
        <input type="hidden" id="editingMCourseID" value="">
        <label for="deptID">Department</label>
        <select id="deptID" required></select>
        <label for="areaID">Segment / Area</label>
        <select id="areaID" required></select>
        <label for="mCourseName">Process / Line Name</label>
        <input id="mCourseName" required>
        <label for="mCourseLevel">Required Level</label>
        <select id="mCourseLevel" required>
          <option value="">Select level</option>
          <option value="Level 1">Level 1</option>
          <option value="Level 2">Level 2</option>
          <option value="Level 3">Level 3</option>
          <option value="Level 4">Level 4</option>
        </select>
        <label for="mCourseDescription">Description</label>
        <textarea id="mCourseDescription"></textarea>
        <label for="mCourseDate">Date</label>
        <input id="mCourseDate" type="date">
        <button type="submit" id="submitBtn">Save Process / Line</button>
        <button type="button" id="cancelEditBtn" style="display:none; background:#6b7a90; margin-top:8px;">Cancel Edit</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; Solution By Parallel Learning</p>
  </footer>

  <script>
    const status = document.getElementById('status');
    const rows = document.getElementById('rows');
    const deptSelect = document.getElementById('deptID');
    const areaSelect = document.getElementById('areaID');
    const params = new URLSearchParams(window.location.search);
    const selectedDeptID = params.get('deptID');
    const selectedAreaID = params.get('areaID');
    let departments = [];
    let areas = [];
    let cachedProcesses = [];
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const editingMCourseIDInput = document.getElementById('editingMCourseID');
    const formModal = document.getElementById('formModal');
    const openAddBtn = document.getElementById('openAddBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    function openModal() { formModal.classList.add('open'); }
    function closeModal() { formModal.classList.remove('open'); }

    function setStatus(message) { status.textContent = message || ''; }

    function resetForm() {
      editingMCourseIDInput.value = '';
      document.getElementById('form').reset();
      if (selectedDeptID) deptSelect.value = selectedDeptID;
      fillAreas(deptSelect.value);
      if (selectedAreaID) areaSelect.value = selectedAreaID;
      formTitle.textContent = 'Add Process / Line';
      submitBtn.textContent = 'Save Process / Line';
      cancelEditBtn.style.display = 'none';
    }

    function startEdit(mCourseID) {
      const row = cachedProcesses.find(p => String(p.mCourseID) === String(mCourseID));
      if (!row) return;
      editingMCourseIDInput.value = row.mCourseID;
      deptSelect.value = row.deptID;
      fillAreas(row.deptID);
      areaSelect.value = row.areaID;
      document.getElementById('mCourseName').value = row.mCourseName || '';
      document.getElementById('mCourseLevel').value = row.mCourseLevel || '';
      document.getElementById('mCourseDescription').value = row.mCourseDescription || '';
      document.getElementById('mCourseDate').value = row.mCourseDate ? String(row.mCourseDate).slice(0, 10) : '';
      formTitle.textContent = `Edit Process / Line #${row.mCourseID}`;
      submitBtn.textContent = 'Update Process / Line';
      cancelEditBtn.style.display = '';
      openModal();
    }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok || data.success === false) throw new Error(data.error || 'Request failed');
      return data;
    }

    function nameBy(rows, idKey, nameKey, id) {
      const row = rows.find(item => String(item[idKey]) === String(id));
      return row ? row[nameKey] : id;
    }

    function fillDepartments() {
      deptSelect.innerHTML = '<option value="">Select department</option>';
      departments.forEach(row => {
        const option = document.createElement('option');
        option.value = row.deptID;
        option.textContent = row.deptName;
        deptSelect.appendChild(option);
      });
      if (selectedDeptID) deptSelect.value = selectedDeptID;
    }

    function fillAreas(deptID) {
      areaSelect.innerHTML = '<option value="">Select segment / area</option>';
      areas
        .filter(row => !deptID || String(row.deptID) === String(deptID))
        .forEach(row => {
          const option = document.createElement('option');
          option.value = row.areaID;
          option.textContent = row.areaName;
          areaSelect.appendChild(option);
        });
      if (selectedAreaID) areaSelect.value = selectedAreaID;
    }

    async function loadMasterData() {
      const [deptData, areaData] = await Promise.all([
        requestJson('/api/hierarchy/departments'),
        requestJson('/api/hierarchy/areas')
      ]);
      departments = deptData.departments || [];
      areas = areaData.areas || [];
      fillDepartments();
      fillAreas(selectedDeptID || deptSelect.value);
    }

    async function loadProcesses() {
      const query = new URLSearchParams();
      if (selectedDeptID) query.set('deptID', selectedDeptID);
      if (selectedAreaID) query.set('areaID', selectedAreaID);
      const url = query.toString() ? `/api/hierarchy/processes?${query}` : '/api/hierarchy/processes';
      const data = await requestJson(url);
      cachedProcesses = data.processes || [];
      rows.innerHTML = '';
      cachedProcesses.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.dataset.deptId = row.deptID;
        tr.dataset.areaId = row.areaID;
        tr.dataset.mCourseId = row.mCourseID;
        tr.innerHTML = `
          <td>${row.mCourseName || ''}</td>
          <td>${row.mCourseLevel || ''}</td>
          <td>${nameBy(departments, 'deptID', 'deptName', row.deptID)}</td>
          <td>${nameBy(areas, 'areaID', 'areaName', row.areaID)}</td>
          <td>
            <button class="edit" data-id="${row.mCourseID}" style="background:#0b5cab;">Edit</button>
            <button class="delete" data-id="${row.mCourseID}">Delete</button>
          </td>
        `;
        rows.appendChild(tr);
      });
      if (!rows.children.length) rows.innerHTML = '<tr><td colspan="5">No processes / lines added yet</td></tr>';
    }

    deptSelect.addEventListener('change', () => fillAreas(deptSelect.value));

    document.getElementById('form').addEventListener('submit', async event => {
      event.preventDefault();
      const editingMCourseID = editingMCourseIDInput.value;
      try {
        const payload = {
          deptID: deptSelect.value,
          areaID: areaSelect.value,
          mCourseName: document.getElementById('mCourseName').value,
          mCourseLevel: document.getElementById('mCourseLevel').value,
          mCourseDescription: document.getElementById('mCourseDescription').value,
          mCourseDate: document.getElementById('mCourseDate').value || null
        };
        if (editingMCourseID) {
          await requestJson(`/api/hierarchy/processes/${editingMCourseID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setStatus('Process / Line updated');
        } else {
          await requestJson('/api/hierarchy/processes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setStatus('Process / Line saved');
        }
        resetForm();
        closeModal();
        await loadProcesses();
      } catch (error) {
        setStatus(error.message);
      }
    });

    cancelEditBtn.addEventListener('click', () => { resetForm(); closeModal(); });
    openAddBtn.addEventListener('click', () => { resetForm(); openModal(); });
    modalCloseBtn.addEventListener('click', () => { resetForm(); closeModal(); });
    formModal.addEventListener('click', event => { if (event.target === formModal) { resetForm(); closeModal(); } });

    rows.addEventListener('click', async event => {
      if (event.target.matches('button.edit')) {
        const tr = event.target.closest('tr[data-m-course-id]');
        if (tr) startEdit(tr.dataset.mCourseId);
        return;
      }
      if (!event.target.matches('button.delete')) {
        const tr = event.target.closest('tr[data-m-course-id]');
        if (tr) {
          // Level 2+ courses now live under a Station, not directly under the
          // Line - so clicking a Line goes to Station Management for it.
          const query = new URLSearchParams({
            deptID: tr.dataset.deptId,
            areaID: tr.dataset.areaId,
            mCourseID: tr.dataset.mCourseId
          });
          window.location.href = `/stationManagement.html?${query}`;
        }
        return;
      }
      if (!confirm('Delete this process / line?')) return;
      try {
        await requestJson(`/api/hierarchy/processes/${event.target.dataset.id}`, { method: 'DELETE' });
        setStatus('Process / Line deleted');
        await loadProcesses();
      } catch (error) {
        setStatus(error.message);
      }
    });

    Promise.all([loadMasterData(), loadProcesses()]).catch(error => setStatus(error.message));
  </script>
</body>

</html>
