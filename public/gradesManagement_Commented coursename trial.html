<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades Management</title>
    <link rel="stylesheet" href="/styles/gradesManagement.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>
    <div class="header">
        <div class="navbar">
            <a href="/adminhomepage.html">Home</a>
            <a href="/logout" class="logout login-btn">Log Out</a>
        </div>
        
        <div class="right-image">
            <img src="/Images/logo/Schaeffler_green_HKS_57N-01.png" alt="Right Side Image" width="270" height="auto">
        </div>
    </div>


    <div class="container table-container">
        <div class="container">
            <div class="grid-item">
                <h1 class="h1class">Grades Management</h1>

                <button id="downloadButton" class="downloadClass btnclass">Download Data</button>
                <button id="editButton" class="btnclass">Enable Editing</button>
                <button id="saveButton" class="btnclass" style="display: none;">Save Changes</button>
                <div>
                    <!-- <label for="searchInput">Search:</label> -->
                    <input type="text" id="searchInput" oninput="searchUsers()" placeholder="Search..."
                        class="search-button">
                    <select id="searchColumn" class="DropdownClass">
                        <option value="0">Search by</option>
                        <option value="1">Name</option>
                        <option value="2">Username</option>
                        <option value="3">Token ID</option>
                    </select>

                </div>

                <table id="gradesTable">
                    <thead>
                        <tr>
                            <th>Sr No</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Token ID</th>
                            <!-- Dynamic headers for pretest and posttest -->


                        </tr>
                    </thead>
                    <tbody id="gradesData">
                        <!-- Grades data will be inserted here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        //let yycourseID, yycourseName, yyColumnName;
        // JavaScript to fetch and display the username and grades data
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch course names from the server
                const courseNamesResponse = await fetch('/courseNames');
                const courseNamesData = await courseNamesResponse.json();
                //const courseNames = courseNamesData.map(course => course.name);
                //const numCourses = courseNames.length;
                console.log(courseNamesData);

                // Extract course names and IDs from the data
                const courseNames = courseNamesData.map(course => ({
                    courseID: course.courseID,
                    courseName: course.courseName
                }));

                const numCourses = courseNames.length;

                // Generate table headers for Pretest and Posttest based on course names
                const tableHeaderRow = document.querySelector('#gradesTable thead tr');
                //tableHeaderRow.innerHTML += `<th colspan="${numCourses}">Pretest</th><th colspan="${numCourses}">Posttest</th>`;

                // Insert course names as table headers
                for (let i = 0; i < numCourses; i++) {
                    const courseId = courseNames[i].courseID;
                    const courseName = courseNames[i].courseName;
                    tableHeaderRow.innerHTML += `<th>${courseName} - Pretest</th><th>${courseName} - Posttest</th>`;
                    yycourseID = courseId;
                    yycourseName = courseName;
                }


                // Fetch grades data
                const gradesDataResponse = await fetch('/gradesData');
                const gradesData = await gradesDataResponse.json();
                const gradesDataContainer = document.getElementById('gradesData');


                gradesData.forEach((user, index) => {
                    const row = document.createElement('tr');

                    // Insert serial number
                    const serialNumberCell = document.createElement('td');
                    serialNumberCell.textContent = index + 1;
                    row.appendChild(serialNumberCell);

                    // Get all keys (column names) from the user object
                    const columns = Object.keys(user);

                    // Specify the order of columns to match the order in the table header
                    const columnsOrder = ['name', 'uName', 'employeeID'];
                    for (let i = 1; i <= numCourses; i++) {
                        columnsOrder.push(`course${i}Pretest`, `course${i}Posttest`);
                    }

                    // Insert data into the table cells in the correct order
                    columnsOrder.forEach(column => {
                        const cell = document.createElement('td');
                        cell.textContent = user[column];
                        // Add data-column attribute to specify the column name
                        cell.dataset.column = column;
                        // Assign a class to the employeeID cell
                        if (column === 'employeeID') {
                            cell.classList.add('employeeID');
                        }
                        row.appendChild(cell);
                    });

                    gradesDataContainer.appendChild(row);
                });
                // Add event listener to each table cell
                const cells = document.querySelectorAll('td:not(.employeeID)');
                cells.forEach(cell => {
                    cell.addEventListener('click', function () {
                        const employeeID = cell.parentElement.querySelector('.employeeID').textContent;
                        const columnName = cell.dataset.column; // Get column name from data attribute
                        const cellValue = cell.textContent.trim(); // Get cell value

                        // Get the course name and ID from the column name
                        const clickedCourseIndex = parseInt(columnName.replace(/[^\d]/g, '')); // Extract course index from column name
                        const clickedCourse = courseNames[clickedCourseIndex - 1]; // courseNames is assumed to be available globally

                        // Update yycourseName and yycourseID
                        //yycourseName = clickedCourse.courseName;
                        //yycourseID = clickedCourse.courseID;
                        //yyColumnName = columnName;

                        console.log('Employee ID:', employeeID);
                        console.log('Column Name:', columnName);
                        console.log('Cell Value:', cellValue);
                        console.log('Clicked Course Name:', yycourseName);
                        console.log('Clicked Course ID:', yycourseID);
                        console.log('CourseName:', courseNames);
                    });
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }

            // Add event listener to each employeeID cell
            const employeeIDCells = document.querySelectorAll('td:nth-child(4)');
            employeeIDCells.forEach(cell => {
                cell.addEventListener('click', async () => {
                    // Extract employeeID from the clicked cell
                    const employeeID = cell.textContent;
                    try {
                        // Fetch data for the clicked employeeID
                        const response = await fetch(`/getUserGrades?employeeID=${employeeID}`);
                        const data = await response.json();
                        // Redirect to userGradesReport.html with the fetched data
                        window.location.href = `/userGradesReport.html?employeeID=${employeeID}`;
                    } catch (error) {
                        console.error('Error fetching user data:', error);
                    }
                });
            });
        });


        function redirectToAdminHomePage() {
            window.location.href = "/adminHomePage.html";
        }


        function searchUsers() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('gradesTable');
            const tr = table.getElementsByTagName('tr');
            const column = document.getElementById('searchColumn').value; // Get the value from the searchColumn input

            // Loop through all table rows, and hide those who don't match the search query
            for (let i = 0; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td')[column]; // Use the column index provided by the searchColumn input
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }


        // Function to download data in .xlsx format
        function downloadData() {
            const gradesTable = document.getElementById('gradesTable');
            const tableData = [];

            // Loop through table rows and cells to get data
            for (let i = 0; i < gradesTable.rows.length; i++) {
                const rowData = [];
                const row = gradesTable.rows[i];
                for (let j = 0; j < row.cells.length; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                tableData.push(rowData);
            }

            // Convert data to CSV format
            const csvContent = tableData.map(row => row.join(',')).join('\n');

            // Create a Blob object containing the CSV data
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);

            // Set the filename for the download
            link.download = 'grades_data.csv';

            // Trigger the download
            link.click();
        }
        // Add event listener to the download button
        document.getElementById('downloadButton').addEventListener('click', downloadData);


        // Add event listener to the edit button
        document.getElementById('editButton').addEventListener('click', function () {
            enableEdit();
        });

        // Add event listener to the save button
        document.getElementById('saveButton').addEventListener('click', function () {
            saveChanges();
        });

        // Function to enable editing for the entire table
        function enableEdit() {
            const cells = document.querySelectorAll('td:not(.employeeID)');
            cells.forEach(cell => {
                // Get the index of the cell's column
                const columnIndex = cell.cellIndex;
                // Exclude certain columns from being editable
                if (!['id', 'name', 'uName', 'employeeID'].includes(cell.dataset.column)) {
                    cell.contentEditable = true;
                    // Add event listener for Tab key press
                    cell.addEventListener('keydown', function (event) {
                        if (event.key === 'Tab') {
                            // Prevent default Tab behavior
                            event.preventDefault();
                            // Find the next editable cell
                            let nextCell = cell.nextElementSibling;
                            while (nextCell) {
                                if (!['id', 'name', 'uName', 'employeeID'].includes(nextCell.dataset.column)) {
                                    // Focus on the next editable cell
                                    nextCell.focus();
                                    break;
                                }
                                nextCell = nextCell.nextElementSibling;
                            }
                        }
                    });
                }
            });
            // Show the save button
            document.getElementById('saveButton').style.display = 'inline-block';
        }


        // Function to save changes
        function saveChanges() {
            //let cell;
            const cells = document.querySelectorAll('td:not(.employeeID)');
            //const columnName = cell.dataset.column;
            const updatedData = [];

            // Iterate through cells to collect updated data
            cells.forEach(cell => {
                updatedData.push({
                    employeeID: cell.parentElement.querySelector('.employeeID').textContent,
                    columnName: cell.dataset.column, // Get the column name from the data attribute
                    //yyColumnName: yyColumnName,
                    newValue: cell.textContent.trim(), // Get the new value after editing
                    //yycourseName: yycourseName,
                    //yycourseID: yycourseID
                });
            });
            // Iterate through cells to collect updated data
            // cells.forEach(cell => {
            //     const cellValue = cell.textContent.trim(); // Get the cell value
            //     // Check if cell value is not empty, null, or undefined
            //     if (cellValue !== '' && cellValue !== null && cellValue !== undefined) {
            //         updatedData.push({
            //             employeeID: cell.parentElement.querySelector('.employeeID').textContent,
            //             columnName: cell.dataset.column, // Get the column name from the data attribute
            //             newValue: cellValue, // Use the cell value
            //             yycourseName: yycourseName,
            //             yycourseID: yycourseID
            //         });
            //     }
            // });

            // Show confirmation alert before saving
            const confirmSave = confirm("Are you sure you want to save the changes?");
            if (!confirmSave) {
                //console.log("Updated dataaa: ", updatedData);
                location.reload();
                return; // Do not proceed with saving if user clicks "Cancel"
            }
            else {
                //console.log("Updated dataaa: ", updatedData);
                // Send updated data to the server
                updateDatabase(updatedData);

                // Send updated data to the server
                fetch('/saveChanges', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedData)
                })
                    .then(response => {
                        if (response.ok) {
                            console.log('Changes saved successfully');
                            location.reload();
                        } else {
                            throw new Error('Failed to save changes');
                        }
                    })
                    .catch(error => {
                        console.error('Error saving changes:', error);
                    });
                document.getElementById('saveButton').style.display = 'none';
            }

        }

        // Function to update the database with edited data
        function updateDatabase(updatedData) {
            // Send the updatedData to the server using AJAX or fetch
            fetch('/saveChanges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Changes saved successfully');
                    } else {
                        throw new Error('Failed to save changes');
                    }
                })
                .catch(error => {
                    console.error('Error saving changes:', error);
                });
        }

    </script>

</body>

</html>
