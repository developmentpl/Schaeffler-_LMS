        // Function to send SCORM variables to the server
        function sendSCORMDataToServer(data) {
            fetch('/updateUserSCORMData', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to update user SCORM data');
                    }
                    console.log('User SCORM data updated successfully');
                })
                .catch(error => console.error('Error:', error));
        }

        window.addEventListener("message", function (event) {
            if (event.data && /*event.data.uName && event.data.duration && event.data.date && event.data.time && event.data.Status &&*/ event.data.posttestScore && event.data.Status && event.data.Score && event.data.duration) {
                // Extract the relevant SCORM variables
                const { uniqueID, posttestScore, Status, Score, duration } = event.data;

                // Retrieve courseID from URL parameters
                const courseID = getCourseIDFromURL();
                if (courseID) {
                    console.log("Course ID: " + courseID);
                }
                else {
                    console.log("Course ID not found.");
                }
                const courseName = getCourseInfoFromURL();
                if (courseName) {
                    console.log("Course Name: " + courseName);
                }
                else {
                    console.log("Course Name not found.");
                }


                // Send the SCORM data to the server
                sendSCORMDataToServer({ uniqueID, posttestScore, courseID, courseName });
                sendSCORMDataToServerCourseRoute({ uniqueID, posttestScore, Status, Score, duration, courseID })
            }
            else if (Storage) {

                const {
                    uniqueID,
                    localPosttest = localStorage.getItem('posttestScore'),
                    localStatus = localStorage.getItem('Status'),
                    localScore = localStorage.getItem('Score'),
                    localduration = localStorage.getItem('duration') } = Storage;
                // Retrieve courseID from URL parameters
                const courseID = getCourseIDFromURL();
                if (courseID) {
                    console.log("Course ID: " + courseID);
                }
                else {
                    console.log("Course ID not found.");
                }
                const courseName = getCourseInfoFromURL();
                if (courseName) {
                    console.log("Course Name: " + courseName);
                }
                else {
                    console.log("Course Name not found.");
                }


                // Send the SCORM data to the server
                sendEXCELDataToServer({ uniqueID, localPosttest, courseID, courseName });
                sendEXCELDataToServerCourseRoute({ uniqueID, localPosttest, localStatus, localScore, localduration, courseID })
            }

        }, false);
