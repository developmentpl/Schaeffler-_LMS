<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Material</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #172033; }
    .header { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid #d9e1ec; }
    .navbar a { margin-left: 20px; color: #172033; text-decoration: none; font-weight: 700; }
    main { max-width: 1100px; margin: 24px auto 40px; padding: 0 20px; }
    .viewer { width: 100%; height: 70vh; border: 1px solid #cfd8e3; background: #fff; }
    .confirm { margin-top: 18px; background: #fff; border: 1px solid #d9e1ec; border-radius: 8px; padding: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; background: #0b5cab; color: #fff; font-weight: 700; cursor: pointer; }
    .status { margin-top: 12px; color: #0b5cab; font-weight: 700; }
  </style>
</head>

<body>
  <div class="header">
    <img src="/Images/logo/finalmahindra.png" alt="Mahindra" width="130" height="80">
    <div class="navbar">
      <a href="/viewscorm.html">Back</a>
      <a href="/logout">Log Out</a>
    </div>
  </div>

  <main>
    <h1 id="courseName">Training Material</h1>
    <iframe id="viewer" class="viewer"></iframe>
    <div class="confirm">
      <strong>I have done the training</strong>
      <button id="completeBtn">Yes</button>
    </div>
    <div class="status" id="status"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const courseID = params.get('courseID');
    const source = params.get('source') === 'refresher' ? 'refresher' : '';
    const language = params.get('language') || '';
    const statusBox = document.getElementById('status');

    async function loadCourse() {
      const query = new URLSearchParams();
      if (source) query.set('source', 'refresher');
      if (language) query.set('language', language);
      const sourceParam = query.toString() ? `?${query.toString()}` : '';
      const response = await fetch(`/api/training-material/${encodeURIComponent(courseID)}${sourceParam}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Unable to load training material');
      document.getElementById('courseName').textContent = data.selectedLanguage
        ? `${data.courseName} - ${data.selectedLanguage}` : data.courseName;
      document.getElementById('viewer').src = data.fileUrl;
    }

    document.getElementById('completeBtn').addEventListener('click', async () => {
      const sourceParam = source ? '?source=refresher' : '';
      const response = await fetch(`/api/training-material/${encodeURIComponent(courseID)}/complete${sourceParam}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        statusBox.textContent = data.error || 'Unable to save training completion';
        return;
      }
      statusBox.textContent = 'Training completed. 100 marks saved.';
    });

    loadCourse().catch(error => {
      statusBox.textContent = error.message;
    });
  </script>
</body>

</html>
