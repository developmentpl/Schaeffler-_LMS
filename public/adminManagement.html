<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management</title>
  <style>
    :root {
      --green: #008f4f;
      --green-dark: #006b3b;
      --green-soft: #e8f6ef;
      --ink: #102033;
      --muted: #617083;
      --line: #d8e4de;
      --surface: rgba(255, 255, 255, 0.94);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 10% 15%, rgba(8, 149, 76, 0.12), transparent 45%),
        radial-gradient(circle at 90% 25%, rgba(8, 149, 76, 0.08), transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(8, 149, 76, 0.10), transparent 45%),
        radial-gradient(circle at 88% 90%, rgba(8, 149, 76, 0.08), transparent 40%),
        #f4f7fb;
      background-attachment: fixed;
    }

    .header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: #fff;
      border-bottom: 1px solid #d9e1ec;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }

    .right-image img {
      display: block;
      width: 280px;
      max-width: 38vw;
      height: auto;
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .navbar a {
      color: #172033;
      text-decoration: none;
      font-weight: 700;
      padding: 0;
      border: 0;
      background: transparent;
      margin-left: 20px;
    }

    .navbar a:hover {
      color: var(--green);
    }

    main {
      flex: 1 0 auto;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .page-heading {
      max-width: 680px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 8px 0 0;
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 16px 36px rgba(31, 52, 43, 0.1);
      backdrop-filter: blur(5px);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin: 12px 0 6px;
      color: #213044;
    }

    input, select {
      width: 100%;
      border: 1px solid #b8c9c0;
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 143, 79, 0.14);
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 143, 79, 0.22);
    }

    form button {
      width: 100%;
      margin-top: 16px;
    }

    .delete {
      background: linear-gradient(135deg, #b42318, #d92d20);
      box-shadow: 0 8px 18px rgba(180, 35, 24, 0.2);
    }

    .edit {
      background: linear-gradient(135deg, #155eef, #2e90fa);
      box-shadow: 0 8px 18px rgba(21, 94, 239, 0.2);
    }

    .action-buttons { display: flex; gap: 8px; }
    .action-buttons button { padding: 8px 10px; }
    .cancel-edit { margin-top: 10px; width: 100%; background: #667085; box-shadow: none; display: none; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e1e9e5;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      background: #fff;
    }

    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid #e6eee9;
      vertical-align: middle;
    }

    th {
      background: var(--green-soft);
      color: #18362a;
      font-size: 13px;
    }

    tbody tr:hover td {
      background: #f8fcfa;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status {
      min-height: 24px;
      color: var(--green-dark);
      font-weight: 800;
      margin-bottom: 12px;
    }

    footer {
      flex-shrink: 0;
      padding: 24px;
      background: #fff;
      border-top: 1px solid #e4e7ec;
      color: #000;
      text-align: center;
      font-size: 14px;
    }

    footer p { margin: 0; }

    @media (max-width: 820px) {
      .header { height: auto; min-height: 72px; align-items: flex-start; gap: 12px; padding: 14px 18px; flex-direction: column; }
      .navbar { justify-content: flex-start; }
      main { padding-top: 28px; }
      .layout { grid-template-columns: 1fr; }
      .right-image img { width: 220px; max-width: 82vw; }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="right-image">
      <img src="/Images/logo/Schaeffler_green_HKS_57N-01.png" alt="Schaeffler Logo">
    </div>
    <div class="navbar">
      <a href="/adminHomePage.html">Home</a>
      <a href="/logout" class="logout login-btn">Log Out</a>
    </div>
  </div>

  <main>
    <div class="page-heading">
      <h1>Admin Management</h1>
      <p class="eyebrow">System administrators, P.V./T.L. and super admins</p>
    </div>
    <div class="status" id="status"></div>
    <div class="layout">
      <section class="panel">
        <h2 id="formTitle">Add Admin</h2>
        <form id="adminForm">
          <label for="name">Name</label>
          <input id="name" required>
          <label for="employeeID">Employee ID</label>
          <input id="employeeID">
          <label for="emailID">Email</label>
          <input id="emailID" type="email">
          <label for="uName">User ID</label>
          <input id="uName" required>
          <label for="uPass">Password</label>
          <input id="uPass" required>
          <label for="uRole">Role</label>
          <select id="uRole">
            <option value="Admin">Admin</option>
            <option value="P.V./T.L.">P.V./T.L.</option>
            <option value="Super Admin">Super Admin</option>
          </select>
          <button type="submit" id="saveButton">Save Admin</button>
          <button type="button" class="cancel-edit" id="cancelEdit">Cancel Edit</button>
        </form>
      </section>
      <section class="panel">
        <h2>Admins</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Employee ID</th><th>User ID</th><th>Password</th><th>Role</th><th>Action</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; Solution By Parallel Learning</p>
  </footer>

  <script>
    const statusBox = document.getElementById('status');
    const rows = document.getElementById('rows');
    const adminForm = document.getElementById('adminForm');
    const formTitle = document.getElementById('formTitle');
    const saveButton = document.getElementById('saveButton');
    const cancelEdit = document.getElementById('cancelEdit');
    let editingAdminID = null;
    let adminsByID = new Map();

    function setStatus(message) { statusBox.textContent = message || ''; }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok || data.success === false) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadAdmins() {
      const data = await requestJson('/api/admins');
      adminsByID = new Map((data.admins || []).map(admin => [String(admin.uniqueID), admin]));
      rows.innerHTML = '';
      (data.admins || []).forEach(admin => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${admin.name || ''}</td>
          <td>${admin.employeeID || ''}</td>
          <td>${admin.uName || ''}</td>
          <td>${admin.uPass || ''}</td>
          <td>${admin.uRole || ''}</td>
          <td><div class="action-buttons"><button class="edit" data-edit-id="${admin.uniqueID}">Edit</button><button class="delete" data-delete-id="${admin.uniqueID}">Delete</button></div></td>
        `;
        rows.appendChild(tr);
      });
      if (!rows.children.length) rows.innerHTML = '<tr><td colspan="6">No admins added yet</td></tr>';
    }

    function resetAdminForm() {
      editingAdminID = null;
      adminForm.reset();
      formTitle.textContent = 'Add Admin';
      saveButton.textContent = 'Save Admin';
      cancelEdit.style.display = 'none';
    }

    function editAdmin(uniqueID) {
      const admin = adminsByID.get(String(uniqueID));
      if (!admin) return;
      editingAdminID = String(uniqueID);
      document.getElementById('name').value = admin.name || '';
      document.getElementById('employeeID').value = admin.employeeID || '';
      document.getElementById('emailID').value = admin.emailID || '';
      document.getElementById('uName').value = admin.uName || '';
      document.getElementById('uPass').value = admin.uPass || '';
      document.getElementById('uRole').value = admin.uRole || 'Admin';
      formTitle.textContent = 'Edit Admin';
      saveButton.textContent = 'Update Admin';
      cancelEdit.style.display = 'block';
      adminForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    rows.addEventListener('click', event => {
      const editID = event.target.dataset.editId;
      const deleteID = event.target.dataset.deleteId;
      if (editID) editAdmin(editID);
      if (deleteID) deleteAdmin(deleteID);
    });

    adminForm.addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const isEditing = Boolean(editingAdminID);
        await requestJson(isEditing ? `/api/admins/${encodeURIComponent(editingAdminID)}` : '/api/admins', {
          method: isEditing ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            employeeID: document.getElementById('employeeID').value,
            emailID: document.getElementById('emailID').value,
            uName: document.getElementById('uName').value,
            uPass: document.getElementById('uPass').value,
            uRole: document.getElementById('uRole').value
          })
        });
        resetAdminForm();
        setStatus(isEditing ? 'Admin updated' : 'Admin saved');
        loadAdmins();
      } catch (error) {
        setStatus(error.message);
      }
    });

    cancelEdit.addEventListener('click', resetAdminForm);

    async function deleteAdmin(uniqueID) {
      if (!confirm('Delete this admin?')) return;
      try {
        await requestJson(`/api/admins/${encodeURIComponent(uniqueID)}`, { method: 'DELETE' });
        setStatus('Admin deleted');
        loadAdmins();
      } catch (error) {
        setStatus(error.message);
      }
    }

    loadAdmins().catch(error => setStatus(error.message));
  </script>
</body>

</html>
