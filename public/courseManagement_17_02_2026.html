<!DOCTYPE html>
<html>

<head>
  <title>Course Management</title>
  <link rel="stylesheet" href="/styles/courseManagement.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background effects */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h1 {
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 10px;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      position: relative;
      z-index: 50;
    }

    .filter-container {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 12px 24px;
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .filter-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .filter-btn.active {
      background: rgba(34, 197, 94, 0.3);
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .department-dropdown {
      position: relative;
      display: inline-block;
      z-index: 100;
    }

    .dropdown-btn {
      padding: 12px 24px;
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .dropdown-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      min-width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 99999;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dropdown-content.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      transition: all 0.3s;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dropdown-content a:last-child {
      border-bottom: none;
    }

    .dropdown-content a:hover {
      background: rgba(59, 130, 246, 0.3);
      padding-left: 25px;
    }

    .filter-info {
      font-style: italic;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      padding: 8px 16px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .action-buttons {
      display: flex;
      gap: 15px;
    }

    .action-btn {
      padding: 12px 24px;
      background: rgba(34, 197, 94, 0.3);
      color: #ffffff;
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .action-btn:hover {
      background: rgba(34, 197, 94, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .course-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .course-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
    }

    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .course-title {
      font-size: 1.4rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .course-id {
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.5);
      backdrop-filter: blur(10px);
    }

    .course-date {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .course-date::before {
      content: '📅';
    }

    .course-description {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .course-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .meta-value {
      font-size: 0.95rem;
      color: #ffffff;
      font-weight: 600;
    }

    .course-actions {
      display: flex;
      gap: 10px;
    }

    .btn-enroll {
      flex: 1;
      padding: 10px 20px;
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-enroll:hover {
      background: rgba(59, 130, 246, 0.5);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .btn-delete {
      padding: 10px 20px;
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.5);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }

    .no-courses {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.2rem;
    }

    .no-courses::before {
      content: '📚';
      display: block;
      font-size: 4rem;
      margin-bottom: 20px;
      filter: grayscale(1) opacity(0.5);
    }

    .back-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 15px 30px;
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      z-index: 1000;
      backdrop-filter: blur(20px);
    }

    .back-btn:hover {
      background: rgba(59, 130, 246, 0.5);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
    }

    @media (max-width: 768px) {
      .courses-grid {
        grid-template-columns: 1fr;
      }

      .controls-section {
        flex-direction: column;
        align-items: stretch;
      }

      .action-buttons {
        flex-direction: column;
      }

      .page-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="page-header">
      <h1>Course Management</h1>
    </div>

    <div class="controls-section">
      <div class="filter-container">
        <button onclick="showAllCourses()" class="filter-btn active" id="allCoursesBtn">All Courses</button>
        
        <div class="department-dropdown">
          <button class="dropdown-btn" id="departmentBtn">Department ▼</button>
          <div class="dropdown-content" id="dropdownMenu">
            <!-- Departments will be loaded dynamically -->
          </div>
        </div>
        
        <span class="filter-info" id="filterInfo">Showing all courses</span>
      </div>

      <div class="action-buttons">
        <button onclick="redirectToAdminHomePage()" class="action-btn">Add Course</button>
        <button onclick="redirectToCreateCoursePage()" class="action-btn">Create New Course</button>
      </div>
    </div>

    <div class="courses-grid" id="courseList">
      <!-- Course cards will be dynamically inserted here -->
    </div>
  </div>

  <script>
    let allCourses = [];
    let currentFilter = 'all';

    // Add event listener to department button
    document.addEventListener('DOMContentLoaded', function() {
      const departmentBtn = document.getElementById('departmentBtn');
      if (departmentBtn) {
        departmentBtn.addEventListener('click', function(event) {
          event.stopPropagation();
          const dropdown = document.getElementById('dropdownMenu');
          dropdown.classList.toggle('show');
        });
      }
    });

    // Close dropdown when clicking outside
    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          const openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }

    function redirectToAdminHomePage() {
      window.location.href = "/index.html";
    }
    
    function redirectToCreateCoursePage() {
      window.location.href = "/createCourse.html";
    }

    function fetchCourseList() {
      fetch('/getCourseList')
        .then(response => response.json())
        .then(data => {
          console.log('Full Course Data from Backend:', data);
          allCourses = data;
          displayCourses(allCourses);
        })
        .catch(error => console.error('Error:', error));
    }

    function fetchDepartments() {
      fetch('/getDepartments')
        .then(response => response.json())
        .then(data => {
          console.log('Departments from Backend:', data);
          const dropdownMenu = document.getElementById('dropdownMenu');
          dropdownMenu.innerHTML = '';
          
          const departmentsList = data.departments || [];
          
          departmentsList.forEach(dept => {
            const link = document.createElement('a');
            link.textContent = dept.name;
            link.onclick = function() {
              filterByDepartment(dept.name);
            };
            dropdownMenu.appendChild(link);
          });
        })
        .catch(error => {
          console.error('Error fetching departments:', error);
          const dropdownMenu = document.getElementById('dropdownMenu');
          dropdownMenu.innerHTML = `
            <a onclick="filterByDepartment('Battery Pack Line')">Battery Pack Line</a>
            <a onclick="filterByDepartment('Module Line')">Module Line</a>
          `;
        });
    }

    function displayCourses(courses) {
      const courseListContainer = document.getElementById('courseList');
      courseListContainer.innerHTML = '';
      
      if (courses.length === 0) {
        courseListContainer.innerHTML = '<div class="no-courses">No courses found</div>';
        updateFilterInfo();
        return;
      }

      courses.forEach(course => {
        const deptValue = course.department || course.Department || course.courseDepartment || 'N/A';
        const levelValue = course.level || course.Level || course.courseLevel || 'N/A';
        
        const card = document.createElement('div');
        card.className = 'course-card';
        
        card.innerHTML = `
          <div class="course-header">
            <div>
              <div class="course-title">${course.courseName}</div>
              <div class="course-date">${course.courseDate}</div>
            </div>
            <div class="course-id">ID: ${course.courseID}</div>
          </div>
          
          <div class="course-description">${course.courseDescription}</div>
          
          <div class="course-meta">
            <div class="meta-item">
              <span class="meta-label">Department</span>
              <span class="meta-value">${deptValue}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Level</span>
              <span class="meta-value">${levelValue}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Teacher</span>
              <span class="meta-value">${course.courseTeacher || 'N/A'}</span>
            </div>
          </div>
          
          <div class="course-actions">
            <button class="btn-enroll" onclick='viewScorm(${JSON.stringify(course)})'>Enroll Users</button>
            <button class="btn-delete" onclick='deleteCourse(${JSON.stringify(course)})'>Delete</button>
          </div>
        `;
        
        courseListContainer.appendChild(card);
      });
      
      updateFilterInfo();
    }

    function showAllCourses() {
      currentFilter = 'all';
      displayCourses(allCourses);
      document.getElementById('allCoursesBtn').classList.add('active');
    }

    function filterByDepartment(department) {
      currentFilter = department;
      
      const filteredCourses = allCourses.filter(course => {
        const deptValue = course.department || course.Department || course.courseDepartment || '';
        return deptValue === department;
      });
      
      displayCourses(filteredCourses);
      document.getElementById('allCoursesBtn').classList.remove('active');
      document.getElementById('dropdownMenu').classList.remove('show');
    }

    function updateFilterInfo() {
      const filterInfo = document.getElementById('filterInfo');
      const courseCount = document.querySelectorAll('.course-card').length;
      
      if (currentFilter === 'all') {
        filterInfo.textContent = `Showing all courses (${courseCount})`;
      } else {
        filterInfo.textContent = `Showing ${currentFilter} courses (${courseCount})`;
      }
    }

    function viewScorm(course) {
      window.location.href = `/courseDetailsPage.html?courseID=${course.courseID}`;
    }

    function deleteCourse(course) {
      if (confirm(`Are you sure you want to delete "${course.courseName}"?`)) {
        fetch('/deleteCourse', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ courseID: course.courseID })
        })
          .then(response => {
            if (response.ok) {
              alert("Course deleted successfully!");
              location.reload();
            } else {
              console.error('Error deleting course:', response.statusText);
            }
          })
          .catch(error => console.error('Error deleting course:', error));
      }
    }

    window.onload = function() {
      fetchCourseList();
      fetchDepartments();
    };

    function BackPage() {
      window.location.href = '/adminhomepage.html';
    }
  </script>
</body>

</html>
